name: odbdesign-local

services:

  ### use local image built from Dockerfile
  server:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./compose-designs:/OdbDesign/designs
    ports:
      - 8888:8888
      - 50051:50051
    environment:
      - ODBDESIGN_SERVER_REQUEST_USERNAME
      - ODBDESIGN_SERVER_REQUEST_PASSWORD
    healthcheck:
      # Default: HTTP check (works out of the box)
      # test: ["CMD", "curl", "-f", "http://localhost:8888/healthz/live"]
      # interval: 30s
      # timeout: 3s
      # retries: 3
      # start_period: 10s
      # gRPC check (uncomment to enable during gRPC troubleshooting; requires grpc_health_probe in image)
      test: ["CMD", "/bin/grpc_health_probe", "-addr=localhost:50051"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  swagger-ui:
    image: ghcr.io/nam20485/odbdesignserver-swaggerui:nam20485-latest
    depends_on:
      - server
    ports:
      - 8080:8080
