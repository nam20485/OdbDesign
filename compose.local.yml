name: odbdesign-local

services:

  ### local image built from Dockerfile in this repo
  server:
    build:
      context: .
      dockerfile: Dockerfile
      # Read-only vcpkg binary cache (consume pre-built packages from GH Packages,
      # do NOT upload). USE_VCPKG_CACHE=1 makes the Dockerfile generate a
      # read-only nuget config at /etc/vcpkg/local.nuget.config from the
      # nuget_auth_token secret; VCPKG_BINARY_SOURCES then points vcpkg at it.
      # Requires NUGET_AUTH_TOKEN in the shell env / .env (GitHub PAT with
      # read:packages scope — same token used by scripts/setup-vcpkg-cache.sh).
      args:
        - USE_VCPKG_CACHE=1
        - VCPKG_BINARY_SOURCES=clear;nugetconfig,/etc/vcpkg/local.nuget.config,read
      # Tokens are injected as BuildKit secrets (mounted at /run/secrets), not
      # passed as build args, not printed in build logs, and kept out of the
      # final image (they exist only in the build stage's layer contents).
      # Resolved from the host environment (or the project .env file):
      #   github_token     <- GITHUB_TOKEN
      #   nuget_auth_token <- NUGET_AUTH_TOKEN
      secrets:
        - github_token
        - nuget_auth_token
    # The container runs as the non-root odbdesign user (uid/gid 10001). The
    # bind mount below replaces the image-layer designs dir, and on a fresh
    # host Docker creates ./compose-designs root-owned, so uploads would fail
    # with EACCES. Prepare the host directory once before first use:
    #   mkdir -p ./compose-designs && sudo chown -R 10001:10001 ./compose-designs
    volumes:
      - ./compose-designs:/OdbDesign/designs
    # No host-published ports — nginx (the `proxy` service below) is the
    # only public ingress. Loopback-only 8888/50051 are kept for local debug.
    ports:
      - 127.0.0.1:8888:8888
      - 127.0.0.1:50051:50051
    expose:
      - 8888
      - 50051
    environment:
      - ODBDESIGN_SERVER_REQUEST_USERNAME
      - ODBDESIGN_SERVER_REQUEST_PASSWORD
    # No explicit healthcheck override: the image's built-in HTTP HEALTHCHECK
    # (curl /healthz/live) applies. The previous gRPC probe referenced
    # /bin/grpc_health_probe, which is not installed in the image.

  swagger-ui:
    image: ghcr.io/nam20485/odbdesignserver-swaggerui:nam20485-latest
    depends_on:
      - server
    # Loopback-only; nginx routes / → swagger-ui:8080.
    ports:
      - 127.0.0.1:8080:8080
    expose:
      - 8080

  # Single public ingress: TLS termination + path-based routing.
  # Pulls certs from ./ssl/ (host) and mounts the config from deploy/nginx/.
  # See deploy/nginx/README.md for endpoint reference and cert setup.
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - server
      - swagger-ui
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    # wget is present in nginx:alpine; spider the swagger-ui container which
    # in turn depends on the REST server. This is a smoke check, not a deep
    # health probe — use /healthz behind the proxy for real probes.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://swagger-ui:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Build-time secret sources. Each reads its value from the host environment
# (or the project .env file) and mounts it into the build container at
# /run/secrets/<name>. Values are not passed as build args, not printed in
# build logs, and kept out of the final image (they exist only in the build
# stage's layer contents, so avoid exporting build-stage layers to a shared cache).
secrets:
  github_token:
    environment: GITHUB_TOKEN
  nuget_auth_token:
    environment: NUGET_AUTH_TOKEN
