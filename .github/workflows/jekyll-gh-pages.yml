# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the release branch
  push:
    branches: ["release"]

  # PR build-validation lane: build the site (Doxygen + Jekyll) on PRs so a
  # docs change that breaks the site build (e.g. raw {{ }} Liquid syntax) is
  # caught at PR time instead of at promotion-to-release time. Nothing is
  # deployed from PRs: the coverage-artifact step and the deploy job below
  # are guarded with `github.event_name != 'pull_request'`.
  pull_request:
    branches: ["nam20485", "development", "staging", "main", "release"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Weekly refresh (Monday 06:00 UTC) so the per-branch coverage pages are
  # re-published even when no release push happens for a while.
  schedule:
    - cron: "0 6 * * 1"

# Least-privilege default (Scorecard Token-Permissions): the build job only
# reads (plus actions:read to download other runs' coverage artifacts); the
# Pages write scopes live on the deploy job that actually deploys.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
# PR validation runs get their own per-PR group so they never queue behind
# (or delay) a production deployment.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    permissions:
      # lists/downloads coverage artifacts from other workflow runs
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Scheduled runs always execute the default branch's workflow file
          # and would otherwise check out that branch (development); keep the
          # published site sourced from `release` exactly like push deploys.
          # Push and workflow_dispatch behavior is unchanged.
          ref: ${{ github.event_name == 'schedule' && 'release' || github.ref }}

      - name: Install Doxygen
        # graphviz is NOT a hard dependency of the doxygen package; without
        # it HAVE_DOT=YES degrades to graph-less HTML with only a warning.
        # apt update first: a stale runner package index 404s on superseded
        # .deb versions (known hosted-runner flake; code-coverage.yml:70
        # already uses this pattern). Gates the weekly scheduled refresh.
        run: sudo apt update && sudo apt install -y doxygen graphviz

      - name: Generate Doxygen docs
        # Single local/CI entry point when present. Scheduled runs execute
        # the DEFAULT BRANCH's workflow file but check out `release`, so
        # between this workflow change landing on the default branch and its
        # promotion to release, the script does not exist in the checked-out
        # tree (promotion-lag window). Fall back to the previous inline
        # invocation then — a silent scheduled failure here stale-dates the
        # live site (it happened before, see the 2026-10-12 chown note).
        run: |
          if [ -f ./scripts/generate-doxygen-docs.sh ]; then
            ./scripts/generate-doxygen-docs.sh
          else
            echo "generate-doxygen-docs.sh absent on this ref (promotion lag) - inline fallback"
            command -v doxygen >/dev/null || { echo "error: doxygen not installed" >&2; exit 1; }
            command -v dot      >/dev/null || { echo "error: graphviz 'dot' not installed" >&2; exit 1; }
            doxygen ./OdbDesignLib/doxygen.conf
          fi

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site

      # doxygen.conf writes its HTML to ./docs/api (OUTPUT_DIRECTORY = docs,
      # HTML_OUTPUT = api, both relative to the workspace root where doxygen
      # runs), so the Jekyll build (source: ./docs) already carries it into
      # ./_site/api. Copy the contents explicitly to keep /api published
      # regardless of Jekyll's static-file handling; the "./dir/." form is
      # idempotent if the directory already exists. (The previously commented
      # ./OdbDesignLib/doxygen/html source never matched this config.)
      #
      # The Jekyll build action runs in a container and leaves ./_site
      # root-owned, so the runner-user cp below (and the coverage step further
      # down, which mkdirs into ./_site) failed with "Permission denied".
      # Every scheduled refresh run since 2026-10-12 failed on this and the
      # live site has been stale since the last successful push deploy
      # (2026-09-09). Restore runner ownership first.
      - name: Copy Doxygen docs
        run: |
          sudo chown -R "$(id -u):$(id -g)" ./_site
          mkdir -p ./_site/api
          cp -r ./docs/api/. ./_site/api/

      # Publish per-branch HTML coverage reports under /coverage/<branch>/ by
      # downloading the linux-coverage-report artifact from each branch's most
      # recent successful push-triggered code-coverage.yml run. This workflow
      # is the ONLY one allowed to publish the Pages site (one Pages deployment
      # per repo; a second publisher would wipe the site), which is why the
      # coverage tree is folded into this artifact here. A missing/expired
      # artifact only yields a placeholder page; it must never fail the deploy.
      #
      # The coverage hub page is hand-built here (it lands in _site/ after the
      # Jekyll build, so it cannot use the site layouts): it reproduces the
      # slate chrome (theme wrapper divs + /assets/css/style.css) and presents
      # the branch table with Lines/Functions chips parsed from the artifact's
      # coverage_summary.txt, so the page reads as a picker for the full
      # per-branch reports instead of masquerading as the report itself.
      - name: Add per-branch coverage reports
        # PR runs validate the site build only: artifact downloads of other
        # runs' coverage artifacts are deploy-time behavior.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          coverage_root="./_site/coverage"
          tmp_root="$(mktemp -d)"
          rows_file="$tmp_root/coverage-rows.html"
          : > "$rows_file"

          # lcov/genhtml legend thresholds for the coverage chips:
          # high >= 90 %, medium >= 75 %, low < 75 %; anything unparsable
          # (or a missing artifact) degrades to a gray chip.
          chip_class() {
            awk -v p="$1" 'BEGIN {
              if (p == "" || p !~ /^[0-9]+(\.[0-9]+)?$/) { print "chip-none"; exit }
              if (p + 0 >= 90) { print "chip-hi"; exit }
              if (p + 0 >= 75) { print "chip-med"; exit }
              print "chip-lo"
            }'
          }

          branch_desc() {
            case "$1" in
              development) echo "default integration branch" ;;
              release)     echo "release line feeding published versions" ;;
              *)           echo "" ;;
            esac
          }

          for branch in development release; do
            branch_dir="$coverage_root/$branch"
            run_id=""
            head_sha=""
            created=""

            # Latest successful push-triggered coverage run for this branch.
            # gh's built-in --jq prints "<id> <sha> <createdAt>", empty when no
            # such run exists (select(. != null) keeps .[0] on an empty list
            # from interpolating to "null null null"). Any failure below
            # degrades to a placeholder.
            if run_info="$(gh run list --workflow=code-coverage.yml --branch="$branch" --event=push --status=success --limit=1 --json databaseId,headSha,createdAt --jq '.[0] | select(. != null) | "\(.databaseId) \(.headSha) \(.createdAt)"' 2>/dev/null)" && [ -n "$run_info" ]; then
              read -r run_id head_sha created <<<"$run_info"
              echo "branch '$branch': found successful code-coverage run $run_id (head $head_sha, $created)"
              if gh run download "$run_id" --name linux-coverage-report --dir "$tmp_root/$branch" \
                 && [ -d "$tmp_root/$branch/html" ] \
                 && mkdir -p "$branch_dir" \
                 && cp -r "$tmp_root/$branch/html/." "$branch_dir/"; then
                short_sha="$(printf '%s' "$head_sha" | cut -c1-7)"
                run_date="${created%%T*}"

                # Lines/Functions percentages from the artifact's lcov summary
                # (coverage_summary.txt ships in the same artifact as html/).
                # lcov --summary prints e.g. "  lines......: 72.4% (18901 of
                # 26103 lines)" - NO space before the percent sign (byte-
                # verified against lcov 2.0-1, CI's version).
                summary="$tmp_root/$branch/coverage_summary.txt"
                lines_pct="$(sed -n 's/^ *lines[^:]*: *\([0-9][0-9.]*\) *%.*/\1/p' "$summary" 2>/dev/null | head -n1 || true)"
                funcs_pct="$(sed -n 's/^ *functions[^:]*: *\([0-9][0-9.]*\) *%.*/\1/p' "$summary" 2>/dev/null | head -n1 || true)"
                lines_cls="$(chip_class "$lines_pct")"
                funcs_cls="$(chip_class "$funcs_pct")"
                if [ -n "$lines_pct" ]; then lines_chip="Lines $lines_pct%"; else lines_chip="Lines n/a"; fi
                if [ -n "$funcs_pct" ]; then funcs_chip="Functions $funcs_pct%"; else funcs_chip="Functions n/a"; fi

                cat >> "$rows_file" <<ROW
          <tr class="cov-row">
            <td class="cov-branch">
              <a class="cov-link" href="./$branch/"><strong>$branch</strong></a>
              <span class="cov-desc">$(branch_desc "$branch")</span>
            </td>
            <td class="cov-meta"><code>$short_sha</code> &middot; $run_date</td>
            <td class="cov-chips">
              <span class="chip $lines_cls" title="Line coverage (lcov legend: green &gt;= 90%, amber &gt;= 75%, red &lt; 75%)">$lines_chip</span>
              <span class="chip $funcs_cls" title="Function coverage">$funcs_chip</span>
            </td>
            <td class="cov-open"><a class="cov-link" href="./$branch/">Open report &rarr;</a></td>
          </tr>
          ROW
                continue
              fi
              echo "warning: could not fetch linux-coverage-report artifact for branch '$branch'; publishing placeholder page" >&2
            else
              echo "no successful code-coverage run found for branch '$branch'; publishing placeholder page"
            fi

            mkdir -p "$branch_dir"
            cat > "$branch_dir/index.html" <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>OdbDesign test coverage &ndash; $branch</title>
            <link rel="stylesheet" href="/assets/css/style.css">
          </head>
          <body>
            <div id="header_wrap" class="outer">
              <header class="inner">
                <a id="forkme_banner" href="https://github.com/nam20485/OdbDesign">View on GitHub</a>
                <h1 id="project_title">OdbDesign test coverage</h1>
                <h2 id="project_tagline">$branch branch</h2>
              </header>
            </div>
            <div id="main_content_wrap" class="outer">
              <section id="main_content" class="inner">
                <h1>$branch</h1>
                <p>No coverage report is available for this branch right now.</p>
                <p>Reports are rebuilt by the <a href="https://github.com/nam20485/OdbDesign/actions/workflows/code-coverage.yml">Code Coverage</a> workflow on every push to the branch; this page refreshes on each site deploy and weekly (Mondays 06:00 UTC).</p>
                <p>Last checked: $(date -u '+%Y-%m-%dT%H:%M:%SZ') &middot; <a href="/coverage/">back to coverage hub</a></p>
              </section>
            </div>
            <div id="footer_wrap" class="outer">
              <footer class="inner">OdbDesign test coverage &middot; <a href="/">site home</a></footer>
            </div>
          </body>
          </html>
          HTML
            cat >> "$rows_file" <<ROW
          <tr class="cov-row cov-missing">
            <td class="cov-branch"><strong>$branch</strong><span class="cov-desc">$(branch_desc "$branch")</span></td>
            <td class="cov-meta">&ndash;</td>
            <td class="cov-chips"><span class="chip chip-none">no report available</span></td>
            <td class="cov-open">&ndash;</td>
          </tr>
          ROW
          done

          checked="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          {
            cat <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>OdbDesign test coverage</title>
            <link rel="stylesheet" href="/assets/css/style.css">
            <style>
              table.cov-table { width: 100%; border-collapse: collapse; margin: 1.25em 0 0.5em 0; font-size: 1.02em; }
              .cov-table th { text-align: left; padding: 10px 14px; font-size: 0.78em; letter-spacing: 0.08em; text-transform: uppercase; color: #c9c9c9; background: #3d3d3d; border-bottom: 2px solid #565656; }
              .cov-table td { padding: 14px; vertical-align: middle; background: #4d4d4d; border-bottom: 1px solid #565656; }
              .cov-row:hover td { background: #565656; }
              .cov-branch .cov-link { font-size: 1.15em; font-weight: 700; }
              .cov-desc { display: block; margin-top: 4px; color: #c9c9c9; font-size: 0.9em; }
              .cov-meta { white-space: nowrap; color: #e6e6e6; }
              .cov-meta code { background: #3a3a3a; padding: 2px 6px; border-radius: 4px; }
              .chip { display: inline-block; padding: 4px 12px; margin: 2px 6px 2px 0; border-radius: 12px; color: #ffffff; font-weight: 600; font-size: 0.88em; white-space: nowrap; }
              .chip-hi { background: #2f7d43; }
              .chip-med { background: #b07d2b; }
              .chip-lo { background: #b04343; }
              .chip-none { background: #6a6a6a; }
              .cov-open a { font-weight: 700; white-space: nowrap; }
              .cov-note { color: #c9c9c9; font-size: 0.9em; }
              .cov-lead { font-size: 1.05em; }
            </style>
          </head>
          <body>
            <div id="header_wrap" class="outer">
              <header class="inner">
                <a id="forkme_banner" href="https://github.com/nam20485/OdbDesign">View on GitHub</a>
                <h1 id="project_title">OdbDesign test coverage</h1>
                <h2 id="project_tagline">per-branch lcov HTML reports</h2>
              </header>
            </div>
            <div id="main_content_wrap" class="outer">
              <section id="main_content" class="inner">
                <h1>Test coverage</h1>
                <p class="cov-lead">This page is the coverage <strong>hub</strong>: each branch publishes its own <strong>complete lcov report</strong> &mdash; directory tree, per-file statistics, and line-by-line annotated source. Pick a branch below to open its report; the percentages shown are from each branch&rsquo;s most recent coverage run.</p>
                <table class="cov-table">
                  <tr><th>Branch</th><th>Latest run</th><th>Coverage</th><th>Report</th></tr>
          HTML
            cat "$rows_file"
            cat <<HTML
                </table>
                <p class="cov-note">Reports regenerate on every push to the branch (<a href="https://github.com/nam20485/OdbDesign/actions/workflows/code-coverage.yml">Code Coverage</a> workflow, lcov + genhtml) and this hub refreshes on each site deploy plus weekly on Mondays 06:00 UTC. Chip colors follow the lcov legend: green &gt;= 90%, amber &gt;= 75%, red &lt; 75%.</p>
                <p class="cov-note">Reports last checked: $checked (UTC) &middot; <a href="/">&larr; site home</a></p>
              </section>
            </div>
            <div id="footer_wrap" class="outer">
              <footer class="inner">OdbDesign test coverage &middot; <a href="/">site home</a></footer>
            </div>
          </body>
          </html>
          HTML
          } > "$coverage_root/index.html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0

  # Deployment job
  deploy:
    # Never deploy from PRs — those runs are build validation only.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      # deploy-pages uses OIDC federation with the Pages service
      id-token: write
      pages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
