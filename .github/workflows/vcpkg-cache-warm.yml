name: Vcpkg Binary Cache Warm

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform target to warm
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - macos
  schedule:
    - cron: '0 8 * * 1'
  workflow_run:
    workflows: ["CMake Build Multi-Platform"]
    types: [completed]
    branches: ["development", "staging", "main", "release"]

permissions:
  contents: read
  # packages:write is REQUIRED: this job pushes the binary cache to GitHub
  # Packages with the workflow GITHUB_TOKEN (packages created by GITHUB_TOKEN
  # inherit the repo's public visibility → free storage; PAT-pushed packages
  # default private and refill the account's private-package quota — the
  # 2026-02-14 → 2026-11-08 feed outage).
  packages: write

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  # Pin the vcpkg clone to the manifest baseline (vcpkg-configuration.json
  # default-registry.baseline); see cmake-multi-platform.yml for rationale.
  VCPKG_COMMIT: 4f6d4ae8247b2dcae554555a135e52bb449dd524
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
  FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
  VCPKG_FEATURE_FLAGS: dependencygraph
  USERNAME: ${{ github.repository_owner }}
  NUGET_XMLDOC_MODE: skip
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  NUGET_TIMEOUT: 1200
  NUGET_PUSH_TIMEOUT_IN_SECONDS: 1200
  # Commit to check out. For workflow_run events this is the triggering run's head SHA.
  # Safe because the warm jobs only run when the triggering event was NOT a pull request
  # (see job `if:` conditions), i.e. only same-repo push/workflow_dispatch runs.
  WARM_REF: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: vcpkg-cache-warm-${{ github.event.workflow_run.head_branch || github.ref_name || 'manual' }}
  cancel-in-progress: false

jobs:
  warm-linux:
    name: Vcpkg-Cache-Warm (Linux)
    if: >
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')) &&
      (github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'linux')
    runs-on: ubuntu-24.04

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.WARM_REF }}

      - name: Install vcpkg Dependencies (Ubuntu)
        run: |
          sudo apt update
          sudo apt install -y -q --no-install-recommends build-essential tar curl zip unzip mono-devel linux-libc-dev

      - name: Generate NuGet Config for Binary Cache
        shell: bash
        run: |
          # GITHUB_TOKEN (not a user PAT): packages pushed with it inherit the
          # repo's public visibility → free storage. defaultPushSource must be
          # the v3 index.json URL — the extensionless form is rejected by
          # GitHub's service (POC-validated 2026-11-08; see
          # docs/plan/vcpkg-github-packages-outage-fix.md §3).
          cat > "$GITHUB_WORKSPACE/nuget.generated.config" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="GitHubPackages" value="${{ env.FEED_URL }}" />
            </packageSources>
            <packageSourceCredentials>
              <GitHubPackages>
                <add key="Username" value="${{ env.USERNAME }}" />
                <add key="ClearTextPassword" value="${{ secrets.GITHUB_TOKEN }}" />
              </GitHubPackages>
            </packageSourceCredentials>
            <apiKeys>
              <add key="${{ env.FEED_URL }}" value="${{ secrets.GITHUB_TOKEN }}" />
            </apiKeys>
            <config>
              <add key="defaultPushSource" value="${{ env.FEED_URL }}" />
              <add key="signatureValidationMode" value="accept" />
            </config>
          </configuration>
          EOF
          echo "VCPKG_BINARY_SOURCES=clear;default,readwrite;nugettimeout,900;nugetconfig,$GITHUB_WORKSPACE/nuget.generated.config,readwrite" >> $GITHUB_ENV

      - name: Create vcpkg Binary Cache Directory
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          # runner image version feeds the cache key (compiler bump detection)
          echo "RUNNER_IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Restore vcpkg Binary Cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        id: vcpkg-restore
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          # Canonical key aligned with cmake-multi-platform.yml's
          # linux-dynamic-release restore prefix: the old vcpkg-archives-linux-x64-*
          # name only matched the code-coverage lane, so the warm entries never fed
          # the PR builds this job exists to protect. Warm runs on development/main
          # scope, which later PRs restore across branch boundaries.
          key: vcpkg-archives-linux-dynamic-release-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ env.VCPKG_COMMIT }}-${{ env.RUNNER_IMAGE_VERSION }}
          restore-keys: |
            vcpkg-archives-linux-dynamic-release-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ env.VCPKG_COMMIT }}-${{ env.RUNNER_IMAGE_VERSION }}-
            vcpkg-archives-linux-x64-

      - name: Install vcpkg
        run: |
          git init "${{ env.VCPKG_ROOT }}"
          git -C "${{ env.VCPKG_ROOT }}" remote add origin https://github.com/Microsoft/vcpkg.git
          git -C "${{ env.VCPKG_ROOT }}" fetch --depth 1 origin "${{ env.VCPKG_COMMIT }}"
          git -C "${{ env.VCPKG_ROOT }}" checkout --detach FETCH_HEAD
          "${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.sh"

      # (The old "Setup NuGet API Key" step is gone: mono `nuget setApiKey`
      # never contributed to vcpkg's pushes — vcpkg passes no -ApiKey and the
      # config above carries everything (POC-validated 2026-11-08: pushes
      # succeed with the generated config alone, with or without an apiKeys
      # section, once the push source is the v3 index.json URL).)

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@8b297075da4cd2a5f1fd21fe011b499edf06e9d2 # master

      - name: Warm vcpkg Binary Cache (static triplet)
        # still consumed by code-coverage.yml (linux-debug preset)
        run: '"${{ env.VCPKG_ROOT }}/vcpkg" install'

      - name: Warm vcpkg Binary Cache (dynamic triplet)
        # consumed by the linux-dynamic-release preset (cmake-multi-platform, Dockerfile)
        run: '"${{ env.VCPKG_ROOT }}/vcpkg" install --triplet x64-linux-dynamic'

      - name: Evaluate vcpkg Cache Payload
        id: cache-payload
        shell: bash
        run: |
          BYTES=$(du -sb "$VCPKG_DEFAULT_BINARY_CACHE" 2>/dev/null | cut -f1 || echo 0)
          BIG=false
          [ "${BYTES:-0}" -ge 100000000 ] && BIG=true
          echo "big=$BIG" >> "$GITHUB_OUTPUT"
          echo "payload bytes=${BYTES:-0} big=$BIG"

      - name: Save vcpkg Binary Cache
        # Canonical key (no run_id probe): one immutable entry per ABI generation;
        # re-running warm after an exact hit costs zero quota. Size guard stops
        # stub saves.
        if: always() && steps.vcpkg-restore.outputs.cache-hit != 'true' && steps.cache-payload.outputs.big == 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-archives-linux-dynamic-release-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ env.VCPKG_COMMIT }}-${{ env.RUNNER_IMAGE_VERSION }}

      - name: Verify Feed Round-Trip (tripwire)
        # A green warm run whose writes nobody can read back is a failure —
        # this is the real replacement for the old grep-style config check.
        # Wipe every local cache layer, then re-install with the NuGet feed as
        # the ONLY source: a fast exit-0 proves the feed serves every package
        # this warm run published. A broken feed forces full rebuilds (45+ min
        # for both triplets) and trips the time budget; a partial miss shows as
        # that package rebuilding in the log above.
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$VCPKG_DEFAULT_BINARY_CACHE" buildtrees packages vcpkg_installed
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          export VCPKG_BINARY_SOURCES="clear;nugettimeout,900;nugetconfig,$GITHUB_WORKSPACE/nuget.generated.config,read"
          t0=$(date +%s)
          "${{ env.VCPKG_ROOT }}/vcpkg" install
          "${{ env.VCPKG_ROOT }}/vcpkg" install --triplet x64-linux-dynamic
          t1=$(date +%s)
          elapsed=$((t1 - t0))
          echo "feed-only reinstall: ${elapsed}s (budget 900s)"
          if [ "$elapsed" -ge 900 ]; then
            echo "::error::feed-only reinstall took ${elapsed}s — packages were REBUILT, not restored; the feed round-trip is broken"
            exit 1
          fi

  warm-macos:
    name: Vcpkg-Cache-Warm (macOS)
    if: >
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')) &&
      (github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'macos')
    runs-on: macos-15

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.WARM_REF }}

      - name: Install mono (macOS)
        run: brew install mono

      - name: Generate NuGet Config for Binary Cache
        shell: bash
        run: |
          # GITHUB_TOKEN (not a user PAT): packages pushed with it inherit the
          # repo's public visibility → free storage. defaultPushSource must be
          # the v3 index.json URL — the extensionless form is rejected by
          # GitHub's service (POC-validated 2026-11-08; see
          # docs/plan/vcpkg-github-packages-outage-fix.md §3).
          cat > "$GITHUB_WORKSPACE/nuget.generated.config" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="GitHubPackages" value="${{ env.FEED_URL }}" />
            </packageSources>
            <packageSourceCredentials>
              <GitHubPackages>
                <add key="Username" value="${{ env.USERNAME }}" />
                <add key="ClearTextPassword" value="${{ secrets.GITHUB_TOKEN }}" />
              </GitHubPackages>
            </packageSourceCredentials>
            <apiKeys>
              <add key="${{ env.FEED_URL }}" value="${{ secrets.GITHUB_TOKEN }}" />
            </apiKeys>
            <config>
              <add key="defaultPushSource" value="${{ env.FEED_URL }}" />
              <add key="signatureValidationMode" value="accept" />
            </config>
          </configuration>
          EOF
          echo "VCPKG_BINARY_SOURCES=clear;default,readwrite;nugettimeout,900;nugetconfig,$GITHUB_WORKSPACE/nuget.generated.config,readwrite" >> $GITHUB_ENV

      - name: Create vcpkg Binary Cache Directory
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          # runner image version feeds the cache key (Xcode/compiler bump detection)
          echo "RUNNER_IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Restore vcpkg Binary Cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        id: vcpkg-restore
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          # Canonical key aligned with cmake-multi-platform.yml's macos-release
          # restore prefix (the old vcpkg-cache-warm-macos-release-* name matched
          # nothing on the build lane, so the warm entry was only ever re-read by
          # the warm job itself).
          key: vcpkg-archives-macos-release-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ env.VCPKG_COMMIT }}-${{ env.RUNNER_IMAGE_VERSION }}
          restore-keys: |
            vcpkg-archives-macos-release-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ env.VCPKG_COMMIT }}-${{ env.RUNNER_IMAGE_VERSION }}-
            vcpkg-archives-macos-release-
            vcpkg-cache-warm-macos-release-

      - name: Install vcpkg
        run: |
          git init "${{ env.VCPKG_ROOT }}"
          git -C "${{ env.VCPKG_ROOT }}" remote add origin https://github.com/Microsoft/vcpkg.git
          git -C "${{ env.VCPKG_ROOT }}" fetch --depth 1 origin "${{ env.VCPKG_COMMIT }}"
          git -C "${{ env.VCPKG_ROOT }}" checkout --detach FETCH_HEAD
          "${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.sh"

      # (The old "Setup NuGet API Key" step is gone: mono `nuget setApiKey`
      # never contributed to vcpkg's pushes — vcpkg passes no -ApiKey and the
      # config above carries everything (POC-validated 2026-11-08: pushes
      # succeed with the generated config alone, with or without an apiKeys
      # section, once the push source is the v3 index.json URL).)

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@8b297075da4cd2a5f1fd21fe011b499edf06e9d2 # master

      - name: Warm vcpkg Binary Cache
        run: '"${{ env.VCPKG_ROOT }}/vcpkg" install'

      - name: Evaluate vcpkg Cache Payload
        id: cache-payload
        shell: bash
        run: |
          BYTES=$(du -sb "$VCPKG_DEFAULT_BINARY_CACHE" 2>/dev/null | cut -f1 || echo 0)
          BIG=false
          [ "${BYTES:-0}" -ge 100000000 ] && BIG=true
          echo "big=$BIG" >> "$GITHUB_OUTPUT"
          echo "payload bytes=${BYTES:-0} big=$BIG"

      - name: Save vcpkg Binary Cache
        if: always() && steps.vcpkg-restore.outputs.cache-hit != 'true' && steps.cache-payload.outputs.big == 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-archives-macos-release-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ env.VCPKG_COMMIT }}-${{ env.RUNNER_IMAGE_VERSION }}

      - name: Verify Feed Round-Trip (tripwire)
        # See the linux job's tripwire: prove the feed actually serves what
        # this warm run published, by wiping local caches and re-installing
        # from the feed alone (cold rebuild would take 45+ min — budget 900s).
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$VCPKG_DEFAULT_BINARY_CACHE" buildtrees packages vcpkg_installed
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          export VCPKG_BINARY_SOURCES="clear;nugettimeout,900;nugetconfig,$GITHUB_WORKSPACE/nuget.generated.config,read"
          t0=$(date +%s)
          "${{ env.VCPKG_ROOT }}/vcpkg" install
          t1=$(date +%s)
          elapsed=$((t1 - t0))
          echo "feed-only reinstall: ${elapsed}s (budget 900s)"
          if [ "$elapsed" -ge 900 ]; then
            echo "::error::feed-only reinstall took ${elapsed}s — packages were REBUILT, not restored; the feed round-trip is broken"
            exit 1
          fi
