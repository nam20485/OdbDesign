name: Code Coverage

on:
  workflow_dispatch:
  push:
    branches: ["development", "staging", "main", "release", "nam20485"]
  pull_request:
    branches: ["development", "staging", "main", "release", "nam20485"]

concurrency:
  # Group by EVENT + head repo + branch (PR lane: PR number). A same-repo PR
  # fires both the push lane and the pull_request lane for the same commit;
  # they must NOT cancel each other. The Pages coverage hub only downloads
  # PUSH-lane artifacts (gh run list --event=push), so a cancelled push lane
  # leaves the hub serving a stale report until the next uncanceled push
  # (observed 2026-11-19: development's dark-theme artifact was skipped
  # because a carrier PR's lane cancelled the push run). Within one lane,
  # newer commits still cancel superseded runs; sibling PRs from the same
  # head branch get distinct groups via the PR number; fork PRs stay
  # isolated by their own repo full name.
  group: code-coverage-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('{0}/{1}', github.event.pull_request.head.repo.full_name, github.event.number) || format('{0}/{1}', github.repository, github.ref_name) }}
  cancel-in-progress: true

# Least-privilege default: jobs escalate only what they need (Scorecard
# Token-Permissions). checks:write for the test-reporter lives at job level;
# the NuGet feed here is READ-only (the warm lane owns feed writes), so no
# packages scope is needed at all.
permissions:
  contents: read

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  # Pin the vcpkg clone to the manifest baseline (vcpkg-configuration.json
  # default-registry.baseline); see cmake-multi-platform.yml for rationale.
  VCPKG_COMMIT: 4f6d4ae8247b2dcae554555a135e52bb449dd524
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
  FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
  VCPKG_FEATURE_FLAGS: dependencygraph
  USERNAME: ${{ github.repository_owner }}
  NUGET_XMLDOC_MODE: skip
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  NUGET_TIMEOUT: 1200
  NUGET_PUSH_TIMEOUT_IN_SECONDS: 1200

jobs:
  coverage-linux:
    name: Linux Coverage
    runs-on: ubuntu-24.04
    # 150 min: a warm-cache steady-state run finishes in ~30-40 min, but a
    # transitional ABI generation (runner-image compiler bump; warm lane has
    # not yet repopulated the canonical key) pays ~45 min of NuGet feed
    # fallback plus the slow -O0 --coverage configure/build — measured runs
    # died at exactly the old 90-min wall mid-Configure (44905978306,
    # 44920588541), discarding the rebuild each time because a job timeout
    # tears down the always() cache-save too.
    timeout-minutes: 150
    permissions:
      # dorny/test-reporter creates check runs
      checks: write
      # GitHub Packages NuGet feed READ (vcpkg binary-cache restore). Without
      # this scope the job's GITHUB_TOKEN gets 403 Forbidden on every feed
      # download and vcpkg silently falls back to building grpc/protobuf/asio
      # & co. from source — which is what blew the 90/150-min job walls from
      # the #657 merge onward (evidence: run 44930358009 Configure log,
      # "Your request could not be authenticated by the GitHub Packages
      # service" before every "Building x64-linux-dbg" from-source pass).
      # Read-only: the warm lane owns feed writes.
      packages: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Checkout OdbDesign Test Data Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: "nam20485/OdbDesignTestData"
          path: "OdbDesignTestData"
          # M0-02: pinned to an EXACT commit, not a floating branch — coverage
          # must be reproducible against a fixed corpus. The pinned SHA is
          # also recorded into coverage/provenance.json by scripts/coverage.sh
          # ("test-data: add IPC-2581 samples ... and degenerate ODB++ designs").
          # To move the corpus: update this SHA and the comment together.
          ref: "b58ab88253b979df5fbcee56f1afb64263d4cf97"

      - name: Add Problem Matchers
        uses: ammaraskar/gcc-problem-matcher@0f9c86f9e693db67dacf53986e1674de5f2e5f28 # master

      - name: Install Coverage Dependencies
        run: |
          sudo apt update
          sudo apt install -y -q --no-install-recommends build-essential tar curl zip unzip mono-devel linux-libc-dev lcov

      - name: Generate NuGet Config for Binary Cache
        shell: bash
        run: |
          # Same shape as cmake-multi-platform.yml (GITHUB_TOKEN auth, v3
          # index.json push source) though this lane only reads the feed.
          cat > "$GITHUB_WORKSPACE/nuget.generated.config" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="GitHubPackages" value="${{ env.FEED_URL }}" />
            </packageSources>
            <packageSourceCredentials>
              <GitHubPackages>
                <add key="Username" value="${{ env.USERNAME }}" />
                <add key="ClearTextPassword" value="${{ secrets.GITHUB_TOKEN }}" />
              </GitHubPackages>
            </packageSourceCredentials>
            <apiKeys>
              <add key="${{ env.FEED_URL }}" value="${{ secrets.GITHUB_TOKEN }}" />
            </apiKeys>
            <config>
              <add key="defaultPushSource" value="${{ env.FEED_URL }}" />
              <add key="signatureValidationMode" value="accept" />
            </config>
          </configuration>
          EOF
          echo "VCPKG_BINARY_SOURCES=clear;default,readwrite;nugettimeout,900;nugetconfig,$GITHUB_WORKSPACE/nuget.generated.config,read" >> $GITHUB_ENV

      - name: Create vcpkg Binary Cache Directory
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          # runner image version feeds the cache key (compiler bump detection)
          echo "RUNNER_IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Restore vcpkg Binary Cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        id: vcpkg-restore
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          # Canonical key (no run_id probe): steady-state runs that restore an
          # exact hit write nothing (the old per-run unique save churned ~1.4 GB
          # per coverage run into the org cache quota). The dynamic-release
          # fallback reads the store vcpkg-cache-warm.yml maintains (it holds
          # both static and dynamic triplets).
          key: vcpkg-archives-linux-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ env.VCPKG_COMMIT }}-${{ env.RUNNER_IMAGE_VERSION }}
          restore-keys: |
            vcpkg-archives-linux-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ env.VCPKG_COMMIT }}-${{ env.RUNNER_IMAGE_VERSION }}-
            vcpkg-archives-linux-dynamic-release-
            vcpkg-archives-linux-x64-

      - name: Install vcpkg
        run: |
          git init "${{ env.VCPKG_ROOT }}"
          git -C "${{ env.VCPKG_ROOT }}" remote add origin https://github.com/Microsoft/vcpkg.git
          git -C "${{ env.VCPKG_ROOT }}" fetch --depth 1 origin "${{ env.VCPKG_COMMIT }}"
          git -C "${{ env.VCPKG_ROOT }}" checkout --detach FETCH_HEAD
          "${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.sh"

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@8b297075da4cd2a5f1fd21fe011b499edf06e9d2 # master

      - name: Install vcpkg Dependencies
        run: '"${{ env.VCPKG_ROOT }}/vcpkg" install'

      - name: Save vcpkg Binary Cache
        # save right after the install so archives survive later step failures/
        # cancellations; guarded to new generations with a real payload (this
        # lane reads the feed, never writes it, so no API key setup here).
        if: always() && steps.vcpkg-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-archives-linux-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ env.VCPKG_COMMIT }}-${{ env.RUNNER_IMAGE_VERSION }}

      # Canonical coverage preset (M0): linux-dynamic-debug shares one
      # protobuf/gRPC runtime across lib, server, and tests (static triplet
      # trees carry dual descriptor pools; see AGENTS.md learned facts).
      - name: Configure CMake with Coverage Flags
        run: >
          cmake --preset linux-dynamic-debug
          -DCMAKE_CXX_FLAGS="--coverage -g -O0 -fprofile-update=atomic"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          -DCMAKE_SHARED_LINKER_FLAGS="--coverage"
          -DCMAKE_MODULE_LINKER_FLAGS="--coverage"

      - name: Build Coverage Configuration
        run: cmake --build --preset linux-dynamic-debug

      # Canonical M0 pipeline (same script as local runs): initial zero-hit
      # capture from .gcno BEFORE tests, real ctest run (JUnit XML), runtime
      # capture AFTER tests, merge, disjoint handwritten/generated/combined
      # scopes, branch coverage everywhere, provenance record. Failed tests
      # FAIL this step (the script propagates ctest's exit code).
      # dorny's check-run API intermittently 404s (HttpError: Not Found);
      # that must not fail a green coverage run (see cmake-multi-platform.yml).
      - name: Run Coverage Pipeline (initial + tests + runtime + reports)
        env:
          ODB_TEST_DATA_DIR: ${{ github.workspace }}/OdbDesignTestData/TEST_DATA
          ODB_TEST_ENVIRONMENT_VARIABLE: ${{ vars.ODB_TEST_ENVIRONMENT_VARIABLE }}
        shell: bash
        run: >
          scripts/coverage.sh
          --preset linux-dynamic-debug
          --no-build
          --check
          --css-file scripts/gcov-dark.css
          --snow-image scripts/snow-dark.png

      - name: Report Test Results
        uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5 # v1.9.1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: linux-coverage-test-results
          path: ${{ github.workspace }}/coverage/coverage-testlog.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-coverage-report
          path: coverage/
          # 30 days: still spans a release window for the Pages workflow
          # (jekyll-gh-pages.yml) to fetch a report from a quiet branch,
          # without accumulating quarter-scale artifact clutter.
          retention-days: 30

      - name: Upload Coverage to Codacy
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          CODACY_ORGANIZATION_PROVIDER: gh
          CODACY_USERNAME: ${{ github.repository_owner }}
          CODACY_PROJECT_NAME: ${{ github.event.repository.name }}
        shell: bash
        run: |
          if [[ -z "${CODACY_API_TOKEN}" && -z "${CODACY_PROJECT_TOKEN}" ]]; then
            echo "No Codacy token configured; skipping coverage upload."
            exit 0
          fi

          # Avoid passing empty token values through the uploader wrapper.
          [[ -n "${CODACY_PROJECT_TOKEN}" ]] || unset CODACY_PROJECT_TOKEN
          [[ -n "${CODACY_API_TOKEN}" ]] || unset CODACY_API_TOKEN

          # coverage.info is the HANDWRITTEN tracefile (generated
          # protobuf/gRPC code is split out into coverage-generated.info and
          # audited via coverage-combined.info), so external coverage
          # tracking measures product code, not codegen.
          #
          # The uploader is pinned to the commit the Codacy get.sh lives at
          # (codacy/codacy-coverage-reporter), fetched in pipe form. Scorecard
          # flags download-then-run pipelines unless the URL is a
          # raw.githubusercontent URL pinned to a full commit SHA — and only
          # the pipe form qualifies (the old `bash <(curl …)` process-
          # substitution form is always treated as an unpinned executed
          # file). Bump the SHA deliberately when adopting a new uploader
          # version.
          curl -Ls https://raw.githubusercontent.com/codacy/codacy-coverage-reporter/54617baa57421746d0afa3df32127d3dd40f3786/get.sh | bash -s -- report -r coverage/coverage.info
