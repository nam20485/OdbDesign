# run CMake build on Windows and Linux
name: Create Release


on:
  #push:
  #  branches: [ "release" ]
  repository_dispatch:
    types: [ "trigger_deploy_release_event" ]

permissions:
  contents: read  

env:
  ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
  ARTIFACTS_DIR_WIN: ${{ github.workspace }}\artifacts
  
jobs:
             
  release:

    # only on pushes to the release branch
    name: Create Release
    #needs: build
    #if: ${{ (github.ref_name == 'release') && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
        contents: write
        # actions/attest-build-provenance: keyless signing via OIDC
        id-token: write
        attestations: write
    
    steps:

          - name: Harden Runner
            uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
            with:
              egress-policy: audit

          - name: Check Dispatch ID
            # Event payload and secret ride env vars — never interpolate
            # untrusted `${{ }}` expressions into the run script itself.
            env:
              DISPATCH_ID: ${{ github.event.client_payload.dispatch_id }}
              EXPECTED_DISPATCH_ID: ${{ secrets.DISPATCH_ID }}
            run: |
              if [[ "$DISPATCH_ID" == "$EXPECTED_DISPATCH_ID" ]]; then
                echo "Dispatch ID is correct"
              else
                echo "Dispatch ID is not correct"
                exit 1
              fi
    
          - name: Checkout Repository
            uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
       
          - name: Download Artifacts
            uses: dawidd6/action-download-artifact@ac66b43f0e6a346234dd65d4d0c8fbb31cb316e5 # v11
            with:
              workflow: cmake-multi-platform.yml
              workflow_conclusion: success
              path: ${{ github.workspace }}/artifacts              
    
          - name: Rename Artifacts
            run: |
              mv ${{ github.workspace }}/artifacts/ubuntu-24.04-artifacts/artifacts-ubuntu-24.04.zip ${{ github.workspace }}/artifacts/OdbDesign-Linux-x64.zip
              mv ${{ github.workspace }}/artifacts/windows-2022-artifacts/artifacts-windows-2022.zip ${{ github.workspace }}/artifacts/OdbDesign-Windows-x64.zip
              mv ${{ github.workspace }}/artifacts/macos-15-artifacts/artifacts-macos-15.zip ${{ github.workspace }}/artifacts/OdbDesign-MacOS-x64.zip
    
          - name: Generate SHA256 Sums
            run: |
              # sha256
              cd ${{ github.workspace }}/artifacts
              sha256sum OdbDesign-Linux-x64.zip > OdbDesign-Linux-x64.zip.sha256sum
              sha256sum OdbDesign-Windows-x64.zip > OdbDesign-Windows-x64.zip.sha256sum
              sha256sum OdbDesign-MacOS-x64.zip > OdbDesign-MacOS-x64.zip.sha256sum          
    
          - name: Import GPG Key
            id: import_gpg
            uses: crazy-max/ghaction-import-gpg@01dd5d3ca463c7f10f7f4f7b4f177225ac661ee4 # v6.1.0
            with:
              gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
              passphrase: ${{ secrets.PASSPHRASE }}
              
          - name: Sign Binaries
            env:
              GPG_PASSPHRASE: ${{ secrets.PASSPHRASE }}
            run: |
              cd "${{ github.workspace }}/artifacts"
              signing_key="$(gpg --batch --with-colons --list-secret-keys | awk -F: '
                ($1 == "sec" || $1 == "ssb") {
                  wantsign = index($12, "s") || index($12, "S")
                  next
                }
                wantsign && $1 == "fpr" {
                  print $10
                  exit
                }
              ')"

              if [ -z "$signing_key" ]; then
                echo "No signing-capable secret key found after import" >&2
                gpg --batch --list-secret-keys >&2
                exit 1
              fi

              gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$signing_key" --detach-sign --armor OdbDesign-Linux-x64.zip
              gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$signing_key" --detach-sign --armor OdbDesign-Windows-x64.zip
              gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$signing_key" --detach-sign --armor OdbDesign-MacOS-x64.zip
    
          - name: Create Release Variables
            # Env-mediated: the dispatch payload's run_number is untrusted and
            # must not be interpolated into the run script.
            env:
              RELEASE_VERSION_PREFIX: ${{ vars.RELEASE_VERSION_PREFIX }}
              DISPATCH_RUN_NUMBER: ${{ github.event.client_payload.run_number }}
            run: |
              export RELEASE_VERSION="${RELEASE_VERSION_PREFIX}.${DISPATCH_RUN_NUMBER}"
              echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
              export RELEASE_TAG="v${RELEASE_VERSION}"
              echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
              export RELEASE_NAME="OdbDesign ${RELEASE_TAG}"
              echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV

          - name: Attest Build Provenance
            id: attest
            # SLSA build provenance for the release binaries (Scorecard
            # Signed-Releases). Produces a single .intoto.jsonl bundle for all
            # three zips, uploaded as a release asset below (create-release.js).
            uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
            with:
              subject-path: |
                ${{ github.workspace }}/artifacts/OdbDesign-Linux-x64.zip
                ${{ github.workspace }}/artifacts/OdbDesign-Windows-x64.zip
                ${{ github.workspace }}/artifacts/OdbDesign-MacOS-x64.zip

          - name: Stage Provenance Bundle
            env:
              BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
            run: |
              cp "$BUNDLE_PATH" \
                 "${{ github.workspace }}/artifacts/OdbDesign-binaries.intoto.jsonl"
    
          # create a release
          - name: "Create GitHub Release"
            uses: "actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea" # v7.0.1
            id: create-github-release
            env:
              WORKSPACE_PATH: ${{ github.workspace }}
              REF_NAME: ${{ github.ref_name }}
            with:
              github-token: "${{ secrets.GITHUB_TOKEN }}"
              script: |
                const script = require('./scripts/create-release.js')
                script({github, context, core}, process.env.WORKSPACE_PATH, process.env.REF_NAME)     
