# run CMake build on Windows and Linux
name: CMake Build Multi-Platform

on:
  workflow_dispatch:
  # Push triggers for protected branches (post-merge builds for Docker) + personal branch
  # Feature branch pushes are NOT built - only PRs gate those
  push:
    branches: ["development", "staging", "main", "release", "nam20485"]
  pull_request:
    branches: ["development", "staging", "main", "release", "nam20485"]

concurrency:
  # Group by head repo + branch instead of github.ref: a same-repo PR fires
  # both the push lane (refs/heads/<branch>) and the pull_request lane
  # (refs/pull/<n>/merge) for the same commit, and without a shared group
  # neither the duplicate nor superseded runs of older commits are ever
  # cancelled. Keying on the head branch makes the newest commit cancel
  # older runs across both lanes; fork PRs stay isolated by their own repo
  # full name. Required status checks only gate on the latest commit, which
  # always gets a fresh run.
  group: cmake-multi-platform-${{ github.event_name == 'pull_request' && format('{0}/{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || format('{0}/{1}', github.repository, github.ref_name) }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  # Pin the vcpkg clone to the manifest baseline (vcpkg-configuration.json
  # default-registry.baseline). An unpinned clone drifts with vcpkg HEAD, and
  # the tool version is part of every package's ABI hash — every drift
  # invalidated the whole binary cache. Keep in sync with the baseline.
  VCPKG_COMMIT: 4f6d4ae8247b2dcae554555a135e52bb449dd524
  # Override vcpkg's default binary cache to a known path for actions/cache
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
  # GitHub Packages NuGet feed URL (v3 index.json — used for reads AND pushes;
  # the extensionless push URL is dead, see the config-generation step).
  FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
  # support for GH dependency graph vcpkg integration
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  VCPKG_FEATURE_FLAGS: dependencygraph
  ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
  ARTIFACTS_DIR_WIN: ${{ github.workspace }}\artifacts
  # GitHub Packages NuGet feed configuration
  USERNAME: ${{ github.repository_owner }}
  # Disable NuGet interactive mode
  NUGET_XMLDOC_MODE: skip
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  # Increase NuGet push timeout (default is 300 seconds) to fix Linux/macOS mono timeout errors.
  # NUGET_PUSH_TIMEOUT_IN_SECONDS is respected by nuget.exe directly (including under mono).
  # NUGET_TIMEOUT is a legacy variable kept for compatibility.
  NUGET_TIMEOUT: 1200
  NUGET_PUSH_TIMEOUT_IN_SECONDS: 1200

jobs:
  build:
    name: CMake-Multi-Platform-Build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      checks: write
      packages: write
    env:
      # Disable NuGet credential-provider plugins for the whole job. When a
      # GitHub Packages request is challenged, nuget.exe routes auth through
      # any installed provider (runner images ship one; the old workflow also
      # installed artifacts-credprovider), the provider demands INTERACTIVE
      # auth, and nuget aborts without ever trying the config's credentials —
      # observed live on the Windows leg: every push failed "Your request
      # could not be authenticated… credential providers requested manual
      # action" while the identical config worked on Linux/macOS (no provider
      # present). The mac/linux lanes already run plugin-free; this makes
      # Windows identical. Same trick as scripts/setup-vcpkg-cache.ps1 and
      # docs/reference/vcpkg/localdev-gh-binary-cacheing.md.
      NUGET_PLUGIN_PATHS: " "

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        include:
          # Windows x64 Release
          - os: windows-2022
            preset: x64-release
          # Linux x64 Release (upgraded to 24.04 for newer toolchain)
          # dynamic triplet: shared protobuf/gRPC runtime — the static
          # linux-release preset loads two protobuf copies and crashes
          # (see docs/completed/linux-dynamic-release-plan.md)
          - os: ubuntu-24.04
            preset: linux-dynamic-release
          # MacOS x64 Release
          - os: macos-15
            preset: macos-release
          # Linux mingw x64 Release
          # - os: ubuntu-22.04
          #   preset: linux-mingw-w64-release
          # # Linux Python Release
          # - os: ubuntu-22.04
          #   preset: python-linux-release

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # Checkout test data early (parallel with build prep for better cache locality)
      - name: Checkout OdbDesign Test Data Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: "nam20485/OdbDesignTestData"
          path: "OdbDesignTestData"
          ref: "main"

      # add problem matchers by compiler
      - name: Add Problem Matchers
        uses: ammaraskar/msvc-problem-matcher@1ebcb382869bfdc2cc645e8a2a43b6d319ea1cc0 # master
        if: matrix.os == 'windows-2022'
      - name: Add Problem Matchers
        uses: ammaraskar/gcc-problem-matcher@0f9c86f9e693db67dacf53986e1674de5f2e5f28 # master
        if: matrix.os != 'windows-2022'

      - name: Install vcpkg Dependencies (Ubuntu)
        run: |
          sudo apt update
          sudo apt install -y -q --no-install-recommends build-essential tar curl zip unzip mono-devel linux-libc-dev
        if: matrix.os == 'ubuntu-24.04'

      - name: Install mono (macOS)
        run: brew install mono
        if: matrix.os == 'macos-15'

      # Generate NuGet config for the GitHub Packages binary cache.
      # Auth is the workflow's GITHUB_TOKEN, NOT a user PAT: packages created
      # by GITHUB_TOKEN inherit the repository's visibility (public) and so
      # are free, while PAT-pushed packages default to PRIVATE and refill the
      # account's private-package quota — the 2026-02-14 → 2026-11-08 outage
      # (every push 403'd "billing limit"). Fork PRs get a fork GITHUB_TOKEN:
      # feed writes fail non-fatally there (same as the old empty-PAT case).
      # Note: The ${{ }} syntax is GitHub Actions expression interpolation, which happens
      # BEFORE the bash script runs. The 'EOF' heredoc marker is quoted only to prevent
      # bash variable interpolation; it does not affect GitHub Actions expression interpolation.
      - name: Generate NuGet Config for Binary Cache
        shell: bash
        run: |
          # Use $GITHUB_WORKSPACE to avoid Windows path backslash escaping issues in bash
          # Write to nuget.generated.config to avoid overwriting the repo's nuget.config
          cat > "$GITHUB_WORKSPACE/nuget.generated.config" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="GitHubPackages" value="${{ env.FEED_URL }}" />
            </packageSources>
            <packageSourceCredentials>
              <GitHubPackages>
                <add key="Username" value="${{ env.USERNAME }}" />
                <add key="ClearTextPassword" value="${{ secrets.GITHUB_TOKEN }}" />
              </GitHubPackages>
            </packageSourceCredentials>
            <apiKeys>
              <add key="${{ env.FEED_URL }}" value="${{ secrets.GITHUB_TOKEN }}" />
            </apiKeys>
            <config>
              <!-- defaultPushSource MUST be the v3 index.json URL: the
                   extensionless form is rejected by GitHub's service for
                   repository-less nupkgs (POC-validated 2026-11-08,
                   docs/plan/vcpkg-github-packages-outage-fix.md §3 RC2). -->
              <add key="defaultPushSource" value="${{ env.FEED_URL }}" />
              <add key="signatureValidationMode" value="accept" />
            </config>
          </configuration>
          EOF
          # Hybrid binary cache strategy (vcpkg 2025+ compatible):
          #   1. 'default' = local file cache (~/.cache/vcpkg/archives or %LOCALAPPDATA%\vcpkg\archives)
          #      Persisted across runs via actions/cache step below — fast same-branch restore.
          #   2. 'nugetconfig' = GitHub Packages NuGet feed (persistent, shared across branches/PRs)
          #      Survives actions/cache eviction, provides cross-branch sharing.
          #      All platforms readwrite: the feed is the only layer that outlives the
          #      10 GB org actions/cache quota. Push auth rides the config above
          #      (GITHUB_TOKEN as ClearTextPassword/apiKey, index.json push source)
          #      — validated end-to-end on ubuntu-24.04 + macos-15 runners
          #      (2026-11-08, branch nam/vcpkg-cache-poc): vcpkg push + feed-only
          #      restore round-trips pass on both OSes. Feed health is asserted
          #      for real by vcpkg-cache-warm.yml's round-trip tripwire.
          # Note: The x-gha and actions backends were removed in vcpkg 2025+.
          # nugettimeout overrides vcpkg's default 100s NuGet CLI timeout (large packages need more time).
          # Note: nugettimeout must come BEFORE nugetconfig to be applied to it
          echo "VCPKG_BINARY_SOURCES=clear;default,readwrite;nugettimeout,900;nugetconfig,$GITHUB_WORKSPACE/nuget.generated.config,readwrite" >> $GITHUB_ENV

      # Persist vcpkg's default local binary cache across workflow runs.
      # This is the fast ephemeral layer — same-branch builds hit this first (< 1 min restore).
      # Cross-branch and cache-evicted builds fall through to NuGet (persistent layer).
      - name: Create vcpkg Binary Cache Directory
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          # runner image version feeds the cache key: image updates bump the
          # bundled compiler
          echo "RUNNER_IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Restore vcpkg Binary Cache
        id: vcpkg-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          # Canonical key (no run_id): one immutable entry per ABI generation
          # (manifest + vcpkg tool + runner image). Exact hits skip the save
          # step below, so steady-state runs add ZERO bytes to the cache quota;
          # the old per-run run_id probe key churned ~1.4 GB/run into the 10 GB
          # org quota and evicted usable entries within hours (the root cause of
          # 2.5 h cold dependency builds on PRs).
          key: vcpkg-archives-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ env.VCPKG_COMMIT }}-${{ env.RUNNER_IMAGE_VERSION }}
          restore-keys: |
            vcpkg-archives-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ env.VCPKG_COMMIT }}-${{ env.RUNNER_IMAGE_VERSION }}-
            vcpkg-archives-${{ matrix.preset }}-

      - name: Record Restored Cache Size
        id: size-restored
        shell: bash
        run: |
          BYTES=$(du -sb "$VCPKG_DEFAULT_BINARY_CACHE" 2>/dev/null | cut -f1 || echo 0)
          echo "bytes=${BYTES:-0}" >> "$GITHUB_OUTPUT"

      # (The old "Setup NuGet Credential Provider (Windows)" step is REMOVED:
      # its provider hijacked GitHub Packages auth on the Windows leg — on any
      # auth challenge nuget.exe routed through the provider, which demanded
      # interactive sign-in and aborted ("credential providers requested manual
      # action"), never falling back to the config's credentials. Linux/macOS
      # never had a provider and authenticate fine with the same config, and
      # the job-level NUGET_PLUGIN_PATHS=" " above neutralizes any provider
      # preinstalled on the runner image, making Windows identical.)

      #
      #   os != windows-2022 (i.e. Linux, MacOS)
      #
      - name: Install vcpkg
        # All platforms now: Windows used to inherit the VS-bundled vcpkg, whose
        # version drifts with the runner image — the vcpkg tool version is part of
        # every package's ABI hash, so each image bump silently invalidated the
        # Windows binary cache. Cloning the pinned VCPKG_COMMIT keeps all three
        # platforms on identical tooling (and identical ABI).
        run: |
          git init "${{ env.VCPKG_ROOT }}"
          git -C "${{ env.VCPKG_ROOT }}" remote add origin https://github.com/Microsoft/vcpkg.git
          git -C "${{ env.VCPKG_ROOT }}" fetch --depth 1 origin "${{ env.VCPKG_COMMIT }}"
          git -C "${{ env.VCPKG_ROOT }}" checkout --detach FETCH_HEAD
          # bootstrap-vcpkg.sh runs under Git Bash on Windows and downloads the
          # Windows vcpkg binary — one path for all three platforms. It takes no
          # flags (it rejected the cargo-culted "-noninteractive" with "Unknown
          # argument" on every leg).
          bash "${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.sh"

      # (The old "Verify NuGet Feed Credentials (Non-Windows)" step grepped
      # nuget.generated.config for ClearTextPassword/defaultPushSource — it
      # validated the config text, not the write path, and passed every run of
      # the 9-month feed outage. Removed per the AGENTS.md ban on grep-style
      # pseudo-validation; real feed-write detection is vcpkg-cache-warm.yml's
      # round-trip tripwire.)

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@8b297075da4cd2a5f1fd21fe011b499edf06e9d2 # master
        if: matrix.os != 'windows-2022'

      # #
      # #   preset == linux-mingw-w64-release
      # #
      # - name: Install mingw-w64
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y --no-install-recommends mingw-w64
      #   if: matrix.preset == 'linux-mingw-w64-release'

      #
      #   os == windows-2022
      #
      - name: Setup VC Tools
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: matrix.os == 'windows-2022'

      - name: Patch vcpkg
        shell: pwsh
        run: |
          # Re-assert the pinned vcpkg root AFTER Setup VC Tools: ilammy/msvc-dev-cmd
          # exports VCPKG_ROOT pointing at the VS-bundled vcpkg, which would leak
          # into $env{VCPKG_ROOT} in the CMake presets and the patch script below.
          echo "VCPKG_ROOT=${{ github.workspace }}\vcpkg" >> $env:GITHUB_ENV
          ./scripts/patch-vcpkg-install.ps1
        if: matrix.os == 'windows-2022'

      # #
      # #  preset == python-x64-release
      # #
      # - name: Generate SWIG Bindings
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y --no-install-recommends swig
      #     chmod +x ./scripts/generate-python-module.sh
      #     ./scripts/generate-python-module.sh
      #   if: matrix.preset == 'python-linux-release'

      - name: Manual vcpkg Install (Linux)
        # match the linux-dynamic-release preset's triplet
        run: '"${{env.VCPKG_ROOT}}/vcpkg" install --triplet x64-linux-dynamic'
        if: matrix.preset == 'linux-dynamic-release'

      - name: Manual vcpkg Install (macOS)
        run: '"${{env.VCPKG_ROOT}}/vcpkg" install'
        if: matrix.os == 'macos-15'

      - name: Manual vcpkg Install (Windows)
        run: '& "${{env.VCPKG_ROOT}}/vcpkg" install --triplet x64-windows'
        if: matrix.os == 'windows-2022'

      # - name: Manual vcpkg Install (mingw-w64)
      #   run: "\"${{env.VCPKG_ROOT}}/vcpkg\" install --triplet x64-mingw-static"
      #   if: matrix.preset == 'linux-mingw-w64-release'

      #
      #   CMake Build - All platforms
      #
      - name: CMake Configure
        # SITE/BUILDNAME feed DartConfiguration.tcl so CDash submissions get
        # stable per-platform/per-preset build names instead of random runner
        # hostnames (see the Submit Test Results to CDash step below).
        run: >
          cmake --preset ${{matrix.preset}}
          -DSITE=gha-${{ matrix.os }}
          -DBUILDNAME=${{ github.ref_name }}-${{ matrix.preset }}

      - name: Evaluate vcpkg Cache Payload
        id: cache-payload
        shell: bash
        run: |
          BYTES=$(du -sb "$VCPKG_DEFAULT_BINARY_CACHE" 2>/dev/null | cut -f1 || echo 0)
          BASE="${{ steps.size-restored.outputs.bytes }}"
          BASE=${BASE:-0}
          GROWTH=$((BYTES - BASE))
          # Only save substantial payloads: cancelled/failed runs used to persist
          # multi-MB stubs that later restored as useless (near-)empty caches.
          # Growth is tracked so an exact canonical hit that still rebuilt
          # packages (evicted partial content) can self-heal via the supplemental
          # save below.
          BIG=false
          [ "${BYTES:-0}" -ge 100000000 ] && BIG=true
          GREW=false
          [ "$GROWTH" -ge 20000000 ] && GREW=true
          echo "big=$BIG" >> "$GITHUB_OUTPUT"
          echo "grew=$GREW" >> "$GITHUB_OUTPUT"
          echo "payload bytes=$BYTES restored-base=$BASE growth=$GROWTH big=$BIG grew=$GREW"

      - name: Save vcpkg Binary Cache
        # New generation (canonical key missed): write it once, immutable. Skipped
        # on exact hits — steady-state runs then consume ZERO cache quota instead
        # of the old ~1.4 GB/run that evicted usable entries within hours.
        if: always() && steps.vcpkg-restore.outputs.cache-hit != 'true' && steps.cache-payload.outputs.big == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-archives-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ env.VCPKG_COMMIT }}-${{ env.RUNNER_IMAGE_VERSION }}

      - name: Save vcpkg Binary Cache (supplemental generation)
        # Exact canonical hit but the run still rebuilt >20 MB: the restored
        # generation was incomplete (e.g. saved by a previously cancelled run).
        # Publish a suffixed copy so later prefix restores pick the complete one.
        if: always() && steps.vcpkg-restore.outputs.cache-hit == 'true' && steps.cache-payload.outputs.grew == 'true' && steps.cache-payload.outputs.big == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-archives-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ env.VCPKG_COMMIT }}-${{ env.RUNNER_IMAGE_VERSION }}-${{ github.run_id }}

      - name: CMake Build
        run: cmake --build --preset ${{matrix.preset}}

      - name: Export ODB_TEST_DATA_DIR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: core.exportVariable('ODB_TEST_DATA_DIR', "${{github.workspace}}/OdbDesignTestData/TEST_DATA" || '');

      - name: CMake Test
        id: cmake-test
        env:
          ODB_TEST_DATA_DIR: ${{github.workspace}}/OdbDesignTestData/TEST_DATA
          ODB_TEST_ENVIRONMENT_VARIABLE: ${{vars.ODB_TEST_ENVIRONMENT_VARIABLE}}
        run: ctest --test-dir ./out/build/${{matrix.preset}}/OdbDesignTests --output-log ${{github.workspace}}/testlog.txt --output-junit ${{github.workspace}}/testlog.xml --output-on-failure
        # let the report step fail the job if it finds failed tests...
        continue-on-error: true

      # report test results
      - name: Report Test Results
        uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5 # v1.9.1
        if: steps.cmake-test.outcome == 'success' || steps.cmake-test.outcome == 'failure'
        with:
          name: ${{ matrix.os }}_test-results
          path: ${{github.workspace}}/testlog.xml
          reporter: java-junit
          path-replace-backslashes: true
          # fail job based on report results
          fail-on-error: true

      #
      #   CDash submission (push builds only)
      #
      - name: Submit Test Results to CDash
        # Push builds only, on the 5 CI branches. PR submissions would spam
        # the dashboard, and fork PRs have no business writing to it.
        # !cancelled() instead of the implicit success(): when tests fail,
        # the "Report Test Results" step (fail-on-error: true) fails the job
        # and a success()-conditioned step would be SKIPPED - the dashboard
        # must receive failing builds too, they are the point of a CI
        # dashboard. If the build itself failed, the submission attempt
        # simply no-ops under continue-on-error.
        if: github.event_name == 'push' && !cancelled()
        # Observability sink: a CDash outage or bad submission must never
        # fail a required status check.
        continue-on-error: true
        # Re-runs the suite from the build root and submits to my.cdash.org
        # project OdbDesign via the scripts/cdash-submit.cmake driver: the
        # dashboard requires authenticated submissions and reads the token
        # only from an Authorization: Bearer header, which plain
        # `ctest -T Submit` cannot send (only ctest_submit(HTTPHEADER) in a
        # ctest -S script can). CTEST_CONFIGURATION_TYPE=Release selects the
        # Release-built tests on the multi-config VS leg; single-config legs
        # ignore it. CDASH_ODBDESIGN_AUTH_TOKEN is the "Submit Only" token
        # minted on the my.cdash.org profile page; absent on fork PRs (no
        # secrets there), but this step is push-only anyway.
        env:
          CDASH_SUBMIT_TOKEN: ${{ secrets.CDASH_ODBDESIGN_AUTH_TOKEN }}
          CTEST_SOURCE_DIRECTORY: ${{ github.workspace }}
          CTEST_BINARY_DIRECTORY: ${{ github.workspace }}/out/build/${{ matrix.preset }}
          CTEST_SITE: gha-${{ matrix.os }}
          CTEST_BUILD_NAME: ${{ github.ref_name }}-${{ matrix.preset }}
          CTEST_CONFIGURATION_TYPE: Release
          # Same env the gating "CMake Test" step sets: the suite re-run
          # below hard-asserts this variable (CrossPlatformTests
          # Test_CrossPlatform_GetEnvSafe_VariableExists); without it CDash
          # would show a false failure on every push. ODB_TEST_DATA_DIR is
          # already exported job-wide by the earlier github-script step.
          ODB_TEST_ENVIRONMENT_VARIABLE: ${{ vars.ODB_TEST_ENVIRONMENT_VARIABLE }}
        run: ctest -S scripts/cdash-submit.cmake

      #
      #   Artifacts
      #
      - name: Compress Artifacts (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir ${{env.ARTIFACTS_DIR}}
          cp ./out/build/${{matrix.preset}}/OdbDesignLib/*.so ${{env.ARTIFACTS_DIR}}
          cp ./out/build/${{matrix.preset}}/Utils/*.so ${{env.ARTIFACTS_DIR}}
          cp ./out/build/${{matrix.preset}}/OdbDesignServer/OdbDesignServer ${{env.ARTIFACTS_DIR}}
          # vcpkg shared libraries (protobuf, gRPC, ...) required at runtime by
          # the linux-dynamic-release build; Dockerfile.prebuilt copies *.so*
          # -P preserves vcpkg's dev symlinks (libfoo.so -> libfoo.so.N -> real
          # file) so each lib ships once; zip -y below stores them as links
          cp -P ./out/vcpkg_installed/x64-linux-dynamic/lib/*.so* ${{env.ARTIFACTS_DIR}}
          # OpenSSL 3 provider modules (resolved relative to libcrypto.so's dir);
          # mirrors the full Dockerfile's ossl-modules COPY
          cp -r ./out/vcpkg_installed/x64-linux-dynamic/lib/ossl-modules ${{env.ARTIFACTS_DIR}}/
          cd ${{env.ARTIFACTS_DIR}}
          zip -r -y ./artifacts-${{matrix.os}}.zip ./*.so* ./ossl-modules ./OdbDesignServer

      - name: Compress Artifacts (MacOS)
        if: matrix.os == 'macos-15'
        run: |
          mkdir ${{env.ARTIFACTS_DIR}}
          cp ./out/build/${{matrix.preset}}/OdbDesignLib/*.dylib ${{env.ARTIFACTS_DIR}}
          cp ./out/build/${{matrix.preset}}/Utils/*.dylib ${{env.ARTIFACTS_DIR}}
          cp ./out/build/${{matrix.preset}}/OdbDesignServer/OdbDesignServer ${{env.ARTIFACTS_DIR}}
          cd ${{env.ARTIFACTS_DIR}}
          zip -r ./artifacts-${{matrix.os}}.zip ./*.dylib ./OdbDesignServer

      - name: Compress Artifacts (Windows)
        if: matrix.os == 'windows-2022'
        run: |
          New-Item -ItemType Directory -Force -Path  ${{env.ARTIFACTS_DIR_WIN}} -Verbose
          Copy-Item -Path ".\out\build\${{matrix.preset}}\*.dll" -Destination  ${{env.ARTIFACTS_DIR_WIN}} -Force -Verbose
          Copy-Item -Path ".\out\build\${{matrix.preset}}\OdbDesignServer.exe" -Destination  ${{env.ARTIFACTS_DIR_WIN}} -Force -Verbose
          Compress-Archive -Path "${{env.ARTIFACTS_DIR_WIN}}\*.dll","${{env.ARTIFACTS_DIR_WIN}}\*.exe"  -DestinationPath "${{env.ARTIFACTS_DIR_WIN}}\artifacts-${{matrix.os}}.zip" -Verbose -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.os }}-artifacts
          path: ${{ env.ARTIFACTS_DIR }}/artifacts-${{matrix.os}}.zip
          retention-days: 14
