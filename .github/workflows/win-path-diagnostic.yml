# TEMPORARY diagnostic (delete before merge): reproduces the Windows-only
# FileArchiveLoadFixture failures (designodb_rigidflex - missing_fonts_standard
# / pin_invalid_electricaltype) without the 40-min C++ build. Probes the exact
# filesystem primitives Utils::extract() uses (std::filesystem create_directory
# / exists / ofstream) at the exact paths the fixture produces, plus system
# bsdtar (= libarchive write_disk, the pre-#630 path) on the real archives.
name: Win Path Diagnostic

on:
  pull_request:
    branches: ["nam20485"]

jobs:
  diag:
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Checkout OdbDesign Test Data Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: "nam20485/OdbDesignTestData"
          path: "OdbDesignTestData"
          ref: "main"

      - name: Probe filesystem primitives at fixture-path shapes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "TEMP=[$env:TEMP] TMP=[$env:TMP] RUNNER_TEMP=[$env:RUNNER_TEMP]"

          # Replicate FileArchiveLoadFixture::createUniqueScratchDir exactly.
          $hex = -join ((1..16) | ForEach-Object { '{0:x}' -f (Get-Random -Maximum 16) })
          $scratch = Join-Path $env:TEMP "odbdesign_tests\$hex`_0"
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          $resolved = [IO.Path]::GetFullPath($scratch)
          Write-Host "scratch=[$scratch] resolved=[$resolved] len=$($resolved.Length)"

          $designs = @(
            'designodb_rigidflex - pin_invalid_electricaltype',
            'designodb_rigidflex - pin_invalid_type',
            'designodb_rigidflex - missing_fonts_standard',
            'designodb_rigidflex - missing_misc_info'
          )

          foreach ($d in $designs) {
            $src = "OdbDesignTestData\TEST_DATA\$d.tgz"
            $dst = Join-Path $scratch "$d.tgz"
            Copy-Item $src $dst
            $dstLen = (Join-Path $resolved "$d.tgz").Length
            Write-Host "`n=== $d (archive abs len $dstLen) ==="

            # 1) system bsdtar = libarchive write_disk (the pre-#630 code path)
            $outDir = Join-Path $scratch $d
            & tar -xzf $dst -C $scratch
            Write-Host "bsdtar exit=$LASTEXITCODE"
            if (Test-Path (Join-Path $outDir 'misc\info')) { Write-Host "bsdtar extracted root dirs OK" }

            # 2) .NET primitives at the deepest real entry path
            $deep = 'steps\cellular_flip-phone\chk\valor_fabrication\actions\8\res\sres\soldermask_bottom\.disp_p.sum'
            $deepPath = Join-Path $outDir $deep
            Write-Host "deepest path len: $($deepPath.Length)"
            try {
              New-Item -ItemType Directory -Force -Path (Split-Path $deepPath) | Out-Null
              [IO.File]::WriteAllText($deepPath, 'probe')
              Write-Host "dotnet write OK at len $($deepPath.Length)"
            } catch { Write-Host "dotnet write FAILED: $($_.Exception.Message)" }
          }

          # 3) length sweep with plain names (no spaces) for pure-limit comparison
          Write-Host "`n=== length sweep (plain names) ==="
          foreach ($len in 150,170,180,190,200,210,220,230,240,250,255,260,270,300) {
            $rel = 'a' * 30
            $p = $resolved
            # build nested path of exact total length
            $p = Join-Path $p ('n' * [Math]::Min(60, [Math]::Max(1, $len - $resolved.Length - 2)))
            while ($p.Length -lt $len - 1) { $p = Join-Path $p 'b' * 10 }
            try {
              New-Item -ItemType Directory -Force -Path $p | Out-Null
              $f = Join-Path $p 'f'
              [IO.File]::WriteAllText($f, 'x')
              Write-Host "len $($f.Length): OK"
            } catch { Write-Host "len ~$len (actual $((Split-Path $p -Leaf).Length)): FAIL $($_.Exception.Message)" }
          }

      - name: "C++ probe (replay real entry list through extract()'s write path)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Dump the REAL entry lists with system bsdtar (= what libarchive reads).
          foreach ($d in 'designodb_rigidflex - pin_invalid_electricaltype','designodb_rigidflex - pin_invalid_type','designodb_rigidflex - missing_fonts_standard','designodb_rigidflex - missing_misc_info') {
            & tar -tzf "OdbDesignTestData\TEST_DATA\$d.tgz" | Out-File -Encoding ascii "entries_$(($d -replace ' - ','_')).txt"
          }
          @'
          // Faithful replay of Utils::extract()'s write path (libarchive_extract.cpp)
          // over the real entry lists: same securely_create_directories walk, same
          // ofstream open/write/close, same weakly_canonical destination handling.
          #include <filesystem>
          #include <fstream>
          #include <iostream>
          #include <string>
          #include <vector>
          namespace fs = std::filesystem;

          static bool securely_create_directories(const fs::path& base, const fs::path& relativePath, std::string& errorOut) {
            std::error_code baseEc;
            if (!fs::exists(base, baseEc) || baseEc) {
              fs::create_directories(base, baseEc);
              if (baseEc) { errorOut = "failed creating destination root: " + baseEc.message(); return false; }
            }
            fs::path current = base;
            for (const auto& component : relativePath) {
              const auto name = component.string();
              if (name.empty()) continue;
              if (name == "." || name == "..") { errorOut = "unsafe component"; return false; }
              current /= component;
              std::error_code symlinkEc;
              if (fs::is_symlink(current, symlinkEc)) { errorOut = "refusing symlink component [" + current.string() + "]"; return false; }
              std::error_code ec;
              if (!fs::exists(current, ec)) {
                fs::create_directory(current, ec);
                if (ec) {
                  std::error_code swapEc;
                  if (fs::is_symlink(current, swapEc)) { errorOut = "refusing symlink (post-create)"; return false; }
                  errorOut = "failed creating [" + current.string() + "] len=" + std::to_string(current.string().size()) + ": " + ec.message();
                  return false;
                }
              } else if (!fs::is_directory(current, ec)) { errorOut = "path component is not a directory [" + current.string() + "]"; return false; }
            }
            return true;
          }

          int main(int argc, char** argv) {
            if (argc != 3) { std::cout << "usage: probe <entries-file> <archive-path>\n"; return 2; }
            std::cout << "temp_directory_path=[" << fs::temp_directory_path().string() << "]\n";

            // replicate FileArchiveLoadFixture::createUniqueScratchDir
            std::error_code ec;
            auto base = fs::temp_directory_path() / "odbdesign_tests";
            fs::create_directories(base, ec);
            static unsigned long counter = 0;
            auto scratch = base / ("diag" + std::to_string(counter++) + "abcdef0123456789");
            fs::create_directory(scratch, ec);
            auto resolved = fs::weakly_canonical(scratch, ec);
            if (!ec) scratch = resolved;
            std::cout << "scratch=[" << scratch.string() << "] len=" << scratch.string().size() << "\n";

            // replicate ArchiveExtractor::Extract dest + weakly_canonical
            fs::path archivePath(argv[2]);
            std::filesystem::copy_file(argv[2], scratch / archivePath.filename(), std::filesystem::copy_options::overwrite_existing, ec);
            if (ec) { std::cout << "copy_file FAILED: " << ec.message() << "\n"; return 1; }
            fs::path dest = scratch / archivePath.stem();
            auto canonicalDest = fs::weakly_canonical(dest, ec);
            if (ec) canonicalDest = dest;
            std::cout << "canonicalDest=[" << canonicalDest.string() << "] len=" << canonicalDest.string().size() << "\n";

            std::vector<std::string> entries;
            std::ifstream in(argv[1]);
            std::string line;
            while (std::getline(in, line)) {
              if (!line.empty() && line.back() == '\r') line.pop_back();
              if (!line.empty()) entries.push_back(line);
            }
            std::cout << "entries: " << entries.size() << "\n";

            size_t files = 0, dirs = 0;
            for (const auto& e : entries) {
              const fs::path rel(e);
              bool isDir = e.back() == '/';
              std::string err;
              if (isDir) {
                if (!securely_create_directories(canonicalDest, rel, err)) {
                  std::cout << "DIR FAIL at [" << e << "]: " << err << "\n"; return 1;
                }
                ++dirs;
              } else {
                if (!securely_create_directories(canonicalDest, rel.parent_path(), err)) {
                  std::cout << "PARENT FAIL at [" << e << "]: " << err << "\n"; return 1;
                }
                fs::path f = canonicalDest / rel;
                std::error_code slEc;
                if (fs::is_symlink(f, slEc)) { std::cout << "SYMLINK TARGET [" << f.string() << "]\n"; return 1; }
                std::ofstream os(f, std::ios::binary | std::ios::trunc);
                if (!os) { std::cout << "OFSTREAM OPEN FAILED [" << f.string() << "] len=" << f.string().size() << "\n"; return 1; }
                os << "probe";
                os.close();
                if (!os) { std::cout << "OFSTREAM CLOSE FAILED [" << f.string() << "] len=" << f.string().size() << "\n"; return 1; }
                ++files;
              }
            }
            std::cout << "REPLAY OK: " << dirs << " dirs, " << files << " files written\n";
            fs::remove_all(scratch, ec);
            return 0;
          }
          '@ | Out-File -Encoding ascii probe.cpp
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $vsPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64"
          cl /nologo /EHsc /std:c++17 probe.cpp
          foreach ($d in 'designodb_rigidflex - pin_invalid_electricaltype','designodb_rigidflex - pin_invalid_type','designodb_rigidflex - missing_fonts_standard','designodb_rigidflex - missing_misc_info') {
            Write-Host "===== $d ====="
            .\probe.exe "entries_$(($d -replace ' - ','_')).txt" "OdbDesignTestData\TEST_DATA\$d.tgz"
            Write-Host "exit=$LASTEXITCODE"
          }
