syntax = "proto3";
option cc_enable_arenas = true;

package Odb.Lib.Protobuf;

import "enums.proto";

//
//  MatrixFile.h
//

// serialization form of FileModel::RgbColor (percent components per the
// project-owned struct; authored with the clean-room color restoration)
message RgbColor {
    optional uint32 red = 1;
    optional uint32 green = 2;
    optional uint32 blue = 3;
    optional bool noPreference = 4;
}

message MatrixFile {
    
    message StepRecord {

        uint32 column = 1;
        uint32 id = 2;
        string name = 3;
    }

    message LayerRecord {
            
        enum Type {
            Signal = 0;
            PowerGround = 1;
            Dielectric = 2;
            Mixed = 3;
            SolderMask = 4;
            SolderPaste = 5;
            SilkScreen = 6;
            Drill = 7;
            Rout = 8;
            Document = 9;
            Component = 10;
            Mask = 11;
            ConductivePaste = 12;
        }

        enum Context {
            Board = 0;
            Misc = 1;
        }

        enum DielectricType {
            None = 0;
            Prepreg = 1;
            Core = 2;
        }

        enum Form {
            Rigid = 0;
            Flex = 1;
        }

        uint32 row = 1;
        Context context = 2;
        Type type = 3;
        string name = 4;
        Polarity polarity = 5;
        DielectricType dielectricType = 6;
        string dielectricName = 7;
        Form form = 8;
        uint32 cuTop = 9;
        uint32 cuBottom = 10;
        uint32 ref = 11;
        string startName = 12;
        string endName = 13;
        string oldName = 14;
        string addType = 15;

        // 16 was the short-lived third-party color field; removed with the
        // contributor carve-out. The number stays reserved; the color
        // storage itself returns as field 18 (clean-room reimplementation).
        reserved 16;

        uint32 id = 17;
        RgbColor color = 18;
    }

    repeated StepRecord steps = 1;
    repeated LayerRecord layers = 2;    
}