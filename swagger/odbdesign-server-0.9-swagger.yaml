# OdbDesign Server REST API - OpenAPI 3.0.3 specification.
#
# GENERATED from the OdbDesignServer C++ (Crow) route registrations in
# OdbDesignServer/Controllers/*.cpp and the protobuf message definitions in
# OdbDesignLib/protoc/*.proto (JSON emitted with default proto3 JSON options:
# lowerCamelCase keys, enums as names, default-valued fields omitted,
# google.protobuf.Timestamp as RFC 3339 strings).
#
# The filename is fixed: the swaggerui container loads /spec/odbdesign-server-0.9-swagger.yaml
# (mounted via the odbdesign-server-swagger-spec ConfigMap, see scripts/deploy.ps1).
openapi: 3.0.3

info:
  title: OdbDesign Server API
  version: "0.9"
  description: |
    REST API for **OdbDesign** — a free open source cross-platform C++ library for parsing
    [ODB++](https://www.ucamco.com/en/odb) design archives (`.tgz`) and accessing their data.

    ## Overview
    The server watches a designs directory for `.tgz` ODB++ archives. Uploaded or discovered
    archives are parsed into two related models:

    * **File model** (`/filemodels/...`) — a near 1:1 mapping of the ODB++ file hierarchy:
      matrix, misc info, steps, layers, symbols, netlists, eda data, features, attrlists.
    * **Product model** (`/designs/...`) — aggregated design objects: components, nets,
      packages, parts.

    ## Authentication
    Most endpoints require **HTTP Basic authentication**. Credentials are configured on the
    server via the `ODBDESIGN_SERVER_REQUEST_USERNAME` / `ODBDESIGN_SERVER_REQUEST_PASSWORD`
    environment variables. Unauthenticated calls return `401 Unauthorized`; if the server has
    no credentials configured, authenticated calls fail with `500`.

    ## Conventions
    * All object responses are `application/json` serialized from protobuf messages
      (protobuf JSON mapping: unset/default fields are omitted from responses).
    * Errors are returned as plain-text bodies (`text/plain`) with a human-readable message.
    * Path parameters must be URL-encoded when they contain special characters
      (names are decoded server-side).
  contact:
    name: Nathan Miller
    email: nmiller217@gmail.com
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
externalDocs:
  description: OdbDesign documentation on GitHub Pages
  url: https://nam20485.github.io/OdbDesign

servers:
  # Relative URL lets swagger-ui "Try it out" hit the current origin, which
  # works through the reverse proxy / ingress without hardcoding a hostname.
  - url: /
    description: Current origin (through ingress / reverse proxy)
  - url: http://192.168.122.200
    description: k3s VM (libvirt NAT LAN IP, Traefik ingress)
  - url: http://100.118.225.119
    description: k3s VM (Tailscale IP, Traefik ingress)
  - url: http://localhost:8888
    description: Local development

tags:
  - name: file upload
    description: Upload ODB++ design archives and list loaded files.
  - name: filemodel
    description: |
      Access the parsed **file model** (FileArchive): the ODB++ file-hierarchy view of a
      design — matrix, misc info, fonts, steps, layers, symbols and their sub-files.
  - name: steps
    description: Step-level data of a file model (eda data, attrlist, profile, stephdr, netlists).
  - name: layers
    description: Layer-level data of a step (components, features, attrlists).
  - name: symbols
    description: Symbol-directory data of a file model (features, attrlists).
  - name: diagnostics
    description: Diagnostic analyses computed across a step's layers.
  - name: designs
    description: |
      Access the **product model** (Design): the aggregated view of a design —
      components, nets, packages and parts.
  - name: health check
    description: Liveness / readiness / startup probes (unauthenticated).
  - name: hello world
    description: Demo templates (unauthenticated).

security:
  - BasicAuth: []

paths:
  /files/list:
    get:
      tags: [file upload]
      operationId: listFiles
      summary: List design archives in the designs directory
      description: |
        Returns every `.tgz` archive discovered in the server's designs directory along with
        its load state and model type (`Design` or `FileArchive`).
        Returns `204 No Content` when the designs directory is empty.
      responses:
        "200":
          description: Archives found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileArchiveList"
              example:
                filearchives:
                  - name: sam20200826.tgz
                    loaded: true
                    type: Design
                  - name: gwb-34hd.tgz
                    loaded: true
                    type: FileArchive
                  - name: notyetloaded.tgz
                    loaded: false
                    type: FileArchive
        "204":
          description: Designs directory is empty (no body).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /files/upload:
    post:
      tags: [file upload]
      operationId: uploadFileMultipart
      summary: Upload one or more design archives (multipart/form-data)
      description: |
        Uploads ODB++ design archives via `multipart/form-data`. Each file part **must** be
        named `file` (other part names are skipped). The uploaded file is stored in the
        server's designs directory and picked up for parsing.
        Use this endpoint from HTML forms; use `/files/upload/{name}` for raw body uploads.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  description: ODB++ design archive(s) (`.tgz`).
                  items:
                    type: string
                    format: binary
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        "201":
          description: Upload stored; the (possibly still loading) archives list is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileArchiveList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /files/upload/{name}:
    post:
      tags: [file upload]
      operationId: uploadFileOctetStream
      summary: Upload a design archive as a raw body (application/octet-stream)
      description: |
        Uploads a single ODB++ design archive. The raw request body is the archive content;
        the `Content-Type` header **must** be exactly `application/octet-stream`. The file is
        stored as `{name}` in the server's designs directory and picked up for parsing.
      parameters:
        - $ref: "#/components/parameters/FileNameParam"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
            example: <binary .tgz content>
      responses:
        "201":
          description: Upload stored; the (possibly still loading) archives list is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileArchiveList"
        "400":
          description: |
            Unsupported `Content-Type` (only `application/octet-stream` is accepted), or a
            malformed request.
          content:
            text/plain:
              schema:
                type: string
              example: "unsupported content type: this endpoint only accepts 'application/octet-stream'"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels:
    get:
      tags: [filemodel]
      operationId: listFileModels
      summary: List design archives and their load state
      description: |
        Same listing as `GET /files/list` — every archive in the designs directory with its
        load state and model type. Returns `204 No Content` when the directory is empty.
      responses:
        "200":
          description: Archives found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileArchiveList"
        "204":
          description: Designs directory is empty (no body).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}:
    get:
      tags: [filemodel]
      operationId: getFileModel
      summary: Get the parsed file archive for a design
      description: |
        Returns the full parsed **FileArchive** file model (steps, layers, symbols, matrix,
        misc info, standard fonts and misc attrlist) for the named design.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
      responses:
        "200":
          description: File archive parsed and returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileArchive"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [filemodel]
      operationId: publishFileModel
      summary: Publish a file archive from a JSON body
      description: |
        Adds (or replaces) a file archive in the server's design cache by deserializing a
        `FileArchive` JSON document (as produced by `GET /filemodels/{name}`) from the request
        body. Returns an empty `200` response on success.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
      requestBody:
        required: true
        description: Serialized FileArchive file model.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileArchive"
      responses:
        "200":
          description: File archive stored (empty body).
        "400":
          description: Empty design name or empty POST body.
          content:
            text/plain:
              schema:
                type: string
              example: no data provided in POST body
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/misc/attrlist:
    get:
      tags: [filemodel]
      operationId: getMiscAttrList
      summary: Get the misc attribute list file
      description: Returns the top-level `misc/attrlist` file of the design.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
      responses:
        "200":
          description: Attrlist file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttrListFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/misc/info:
    get:
      tags: [filemodel]
      operationId: getMiscInfo
      summary: Get the misc info file
      description: |
        Returns the `misc/info` file: product model name, ODB++ version, creation/save
        timestamps, units, etc.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
      responses:
        "200":
          description: Misc info file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiscInfoFile"
              example:
                productModelName: SAM
                jobName: sam20200826
                odbVersionMajor: "8"
                odbVersionMinor: "0"
                odbSource: test source
                creationDateDate: "2020-08-26T00:00:00Z"
                saveApp: test app
                units: INCH
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/matrix/matrix:
    get:
      tags: [filemodel]
      operationId: getMatrix
      summary: Get the matrix file (step and layer records)
      description: |
        Returns the `matrix/matrix` file: the board stackup — step records and layer records
        with type/context/polarity/copper-weight columns.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
      responses:
        "200":
          description: Matrix file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatrixFile"
              example:
                steps:
                  - column: 1
                    id: 1
                    name: pcb
                layers:
                  - row: 1
                    context: Board
                    type: Signal
                    name: top
                    polarity: Positive
                    cuTop: 3
                    cuBottom: 3
                    ref: 4
                    startName: top
                    endName: ground_plane
                    oldName: top
                    addType: ""
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/fonts/standard:
    get:
      tags: [filemodel]
      operationId: getStandardFonts
      summary: Get the standard fonts file
      description: "Returns the `fonts/standard` file: vector stroke font definitions."
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
      responses:
        "200":
          description: Standard fonts file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardFontsFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/steps:
    get:
      tags: [steps]
      operationId: listSteps
      summary: List step names
      description: Returns the names of all steps (e.g. `pcb`, panel steps) in the design.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
      responses:
        "200":
          description: Step names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepNameList"
              example:
                steps: [pcb]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/steps/{step}:
    get:
      tags: [steps]
      operationId: getStep
      summary: Get a step directory
      description: |
        Returns the full **StepDirectory** for a step, including its layers, netlists,
        eda data, attrlist, profile and stephdr files.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
        - $ref: "#/components/parameters/StepNameParam"
      responses:
        "200":
          description: Step directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepDirectory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/steps/{step}/eda_data:
    get:
      tags: [steps]
      operationId: getStepEdaData
      summary: Get a step's eda data file
      description: |
        Returns the `eda/net` and `eda/pkg` data for the step: nets with subnets
        (vias, traces, planes, toeprints), packages with pins/outlines, and feature groups.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
        - $ref: "#/components/parameters/StepNameParam"
      responses:
        "200":
          description: Eda data file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdaDataFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/steps/{step}/attrlist:
    get:
      tags: [steps]
      operationId: getStepAttrList
      summary: Get a step's attribute list file
      description: Returns the step-level `attrlist` file.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
        - $ref: "#/components/parameters/StepNameParam"
      responses:
        "200":
          description: Attrlist file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttrListFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/steps/{step}/profile:
    get:
      tags: [steps]
      operationId: getStepProfile
      summary: Get a step's profile
      description: |
        Returns the step profile: the board outline as a FeaturesFile whose feature records
        trace the profile contour.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
        - $ref: "#/components/parameters/StepNameParam"
      responses:
        "200":
          description: Profile features file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturesFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/steps/{step}/stephdr:
    get:
      tags: [steps]
      operationId: getStepHdr
      summary: Get a step's stephdr file
      description: |
        Returns the step header: datum/origin/active-area extents and step-repeat records.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
        - $ref: "#/components/parameters/StepNameParam"
      responses:
        "200":
          description: Step header file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepHdrFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/steps/{step}/netlists:
    get:
      tags: [steps]
      operationId: listNetlists
      summary: List netlist names for a step
      description: Returns the names of the netlist files in the step (e.g. `cad-net`, `36p`).
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
        - $ref: "#/components/parameters/StepNameParam"
      responses:
        "200":
          description: Netlist names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetlistNameList"
              example:
                netlists: [cad-net]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/steps/{step}/netlists/{netlist}:
    get:
      tags: [steps]
      operationId: getNetlist
      summary: Get a netlist file
      description: Returns the netlist file with its net records and net point records.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
        - $ref: "#/components/parameters/StepNameParam"
        - $ref: "#/components/parameters/NetlistNameParam"
      responses:
        "200":
          description: Netlist file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetlistFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/steps/{step}/layers:
    get:
      tags: [layers]
      operationId: listLayers
      summary: List layer names for a step
      description: Returns the names of all layers in the step.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
        - $ref: "#/components/parameters/StepNameParam"
      responses:
        "200":
          description: Layer names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayerNameList"
              example:
                layers: [top, ground_plane, power_plane, bottom, solder_mask_top]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/steps/{step}/layers/{layer}:
    get:
      tags: [layers]
      operationId: getLayer
      summary: Get a layer directory
      description: |
        Returns the full **LayerDirectory** including its components, features, attrlist
        and tools files.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
        - $ref: "#/components/parameters/StepNameParam"
        - $ref: "#/components/parameters/LayerNameParam"
      responses:
        "200":
          description: Layer directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayerDirectory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/steps/{step}/layers/{layer}/components:
    get:
      tags: [layers]
      operationId: getLayerComponents
      summary: Get a layer's components file
      description: |
        Returns the layer components file: component records (placement, rotation, mirror,
        toeprints) and BOM description records.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
        - $ref: "#/components/parameters/StepNameParam"
        - $ref: "#/components/parameters/LayerNameParam"
      responses:
        "200":
          description: Components file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentsFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/steps/{step}/layers/{layer}/features:
    get:
      tags: [layers]
      operationId: getLayerFeatures
      summary: Get a layer's features file
      description: |
        Returns the layer features file: arcs, pads, surfaces, barcodes, texts and lines with
        their symbol references and attribute lookup tables.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
        - $ref: "#/components/parameters/StepNameParam"
        - $ref: "#/components/parameters/LayerNameParam"
      responses:
        "200":
          description: Features file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturesFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/steps/{step}/layers/{layer}/attrlist:
    get:
      tags: [layers]
      operationId: getLayerAttrList
      summary: Get a layer's attribute list file
      description: Returns the layer-level `attrlist` file.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
        - $ref: "#/components/parameters/StepNameParam"
        - $ref: "#/components/parameters/LayerNameParam"
      responses:
        "200":
          description: Attrlist file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttrListFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/steps/{step}/diagnostics/symbol_units:
    get:
      tags: [diagnostics]
      operationId: getStepSymbolUnitsDiagnostics
      summary: Analyze symbol unit-type consistency across a step's layers
      description: |
        Computes, for every layer of the step, the unit type of each referenced symbol
        (metric / imperial / none) and compares it against the layer features file's declared
        units. Useful for detecting mixed or mismatched unit types in a design.

        Note: this response is built directly by the server (not protobuf-serialized), so
        its keys are `snake_case`.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
        - $ref: "#/components/parameters/StepNameParam"
      responses:
        "200":
          description: Per-layer symbol unit diagnostics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymbolUnitsDiagnostics"
              example:
                design: sam20200826
                step: pcb
                layers:
                  - layer: top
                    features_units_raw: INCH
                    symbols_total: 34
                    symbol_unit_counts: { metric: 0, imperial: 34, none: 0 }
                    has_mixed_symbol_unit_types: false
                    has_mismatch_vs_features_units: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/symbols:
    get:
      tags: [symbols]
      operationId: listSymbols
      summary: List symbol names
      description: Returns the names of all symbol directories in the design.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
      responses:
        "200":
          description: Symbol names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymbolNameList"
              example:
                symbols: [r155, pad_square, thermal_80]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/symbols/{symbol}:
    get:
      tags: [symbols]
      operationId: getSymbol
      summary: Get a symbol directory
      description: Returns the symbol directory including its features and attrlist files.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
        - $ref: "#/components/parameters/SymbolNameParam"
      responses:
        "200":
          description: Symbol directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymbolsDirectory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/symbols/{symbol}/features:
    get:
      tags: [symbols]
      operationId: getSymbolFeatures
      summary: Get a symbol's features file
      description: Returns the feature records that make up the symbol.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
        - $ref: "#/components/parameters/SymbolNameParam"
      responses:
        "200":
          description: Features file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturesFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /filemodels/{name}/symbols/{symbol}/attrlist:
    get:
      tags: [symbols]
      operationId: getSymbolAttrList
      summary: Get a symbol's attribute list file
      description: Returns the symbol-level `attrlist` file.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
        - $ref: "#/components/parameters/SymbolNameParam"
      responses:
        "200":
          description: Attrlist file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttrListFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /designs:
    get:
      tags: [designs]
      operationId: listDesigns
      summary: List design archives and their load state
      description: |
        Same listing as `GET /files/list` and `GET /filemodels`. Returns `204 No Content`
        when the designs directory is empty.
      responses:
        "200":
          description: Archives found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileArchiveList"
        "204":
          description: Designs directory is empty (no body).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /designs/{name}:
    get:
      tags: [designs]
      operationId: getDesign
      summary: Get the product model for a design
      description: |
        Returns the aggregated **Design** product model: nets, packages, components and parts
        (with their cross-references). By default the embedded file model is *clipped*
        (removed) to reduce payload size; pass `include_filearchive=true` to keep it.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
        - name: include_filearchive
          in: query
          required: false
          description: |
            Include the full embedded file model in the response. Accepted values: `true`,
            `yes` (any other value is treated as false).
          schema:
            type: string
            enum: [true, yes]
          example: true
      responses:
        "200":
          description: Design product model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Design"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /designs/{name}/components:
    get:
      tags: [designs]
      operationId: getDesignComponents
      summary: Get a design's components
      description: Returns the design's component list (refdes, part, package, board side).
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
      responses:
        "200":
          description: Components array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Component"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /designs/{name}/nets:
    get:
      tags: [designs]
      operationId: getDesignNets
      summary: Get a design's nets
      description: Returns the design's net list with pin connections.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
      responses:
        "200":
          description: Nets array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Net"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /designs/{name}/packages:
    get:
      tags: [designs]
      operationId: getDesignPackages
      summary: Get a design's packages
      description: Returns the design's package list with pin definitions.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
      responses:
        "200":
          description: Packages array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Package"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /designs/{name}/parts:
    get:
      tags: [designs]
      operationId: getDesignParts
      summary: Get a design's parts
      description: Returns the design's part (part-number) list.
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
      responses:
        "200":
          description: Parts array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Part"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /healthz/live:
    get:
      tags: [health check]
      operationId: healthLive
      summary: Liveness probe
      description: Returns `200` with a plain-text body when the server process is alive.
      security: []
      responses:
        "200":
          description: Server is alive.
          content:
            text/plain:
              schema:
                type: string
              example: "healthy: live"

  /healthz/started:
    get:
      tags: [health check]
      operationId: healthStarted
      summary: Startup probe
      description: Returns `200` once the server has finished starting up.
      security: []
      responses:
        "200":
          description: Server has started.
          content:
            text/plain:
              schema:
                type: string
              example: "healthy: started"

  /healthz/ready:
    get:
      tags: [health check]
      operationId: healthReady
      summary: Readiness probe
      description: Returns `200` when the server is ready to accept requests.
      security: []
      responses:
        "200":
          description: Server is ready.
          content:
            text/plain:
              schema:
                type: string
              example: "healthy: ready"

  /helloworld:
    get:
      tags: [hello world]
      operationId: helloWorld
      summary: Hello world demo page
      description: Renders the `helloworld.html` mustache template (unauthenticated demo).
      security: []
      responses:
        "200":
          description: HTML page.
          content:
            text/html:
              schema:
                type: string

  /hellodesign/{name}:
    get:
      tags: [hello world]
      operationId: helloDesign
      summary: Hello design demo page
      description: |
        Renders the `helloworld.html` mustache template with `{design}` substituted by the
        given name (unauthenticated demo).
      security: []
      parameters:
        - $ref: "#/components/parameters/DesignNameParam"
      responses:
        "200":
          description: HTML page.
          content:
            text/html:
              schema:
                type: string

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic authentication. The server's credentials are set at startup via the
        `ODBDESIGN_SERVER_REQUEST_USERNAME` / `ODBDESIGN_SERVER_REQUEST_PASSWORD`
        environment variables.

  parameters:
    DesignNameParam:
      name: name
      in: path
      required: true
      description: Design (archive) name, without directory — e.g. `sam20200826.tgz`.
      schema:
        type: string
      example: sam20200826.tgz
    FileNameParam:
      name: name
      in: path
      required: true
      description: File name to store the uploaded archive as (e.g. `mydesign.tgz`).
      schema:
        type: string
      example: mydesign.tgz
    StepNameParam:
      name: step
      in: path
      required: true
      description: Step name — e.g. `pcb`.
      schema:
        type: string
      example: pcb
    LayerNameParam:
      name: layer
      in: path
      required: true
      description: Layer name — e.g. `top`, `ground_plane`, `solder_mask_top`.
      schema:
        type: string
      example: top
    SymbolNameParam:
      name: symbol
      in: path
      required: true
      description: Symbol name — e.g. `r155`, `pad_square`.
      schema:
        type: string
      example: r155
    NetlistNameParam:
      name: netlist
      in: path
      required: true
      description: Netlist name — e.g. `cad-net`.
      schema:
        type: string
      example: cad-net

  responses:
    Unauthorized:
      description: Missing or invalid HTTP Basic credentials.
      content:
        text/plain:
          schema:
            type: string
          example: Unauthorized
    BadRequest:
      description: Malformed request (e.g. empty/invalid name, unsupported content type).
      content:
        text/plain:
          schema:
            type: string
          example: design name not specified
    NotFound:
      description: Named resource (design / step / layer / symbol / netlist) not found.
      content:
        text/plain:
          schema:
            type: string
          example: 'design: "sam20200826.tgz" not found'
    InternalError:
      description: Internal server error (e.g. file handling failure or unconfigured credentials).
      content:
        text/plain:
          schema:
            type: string
          example: failed handling new file

  schemas:
    # ------------------------------------------------------------------ common
    FileArchiveList:
      type: object
      description: Listing of design archives known to the server.
      required: [filearchives]
      properties:
        filearchives:
          type: array
          description: Archives discovered in the server's designs directory.
          items:
            $ref: "#/components/schemas/FileArchiveEntry"
    FileArchiveEntry:
      type: object
      description: One archive in the designs directory and its load state.
      properties:
        name:
          type: string
          description: Archive file name.
          example: sam20200826.tgz
        loaded:
          type: boolean
          description: Whether the archive has been parsed into the server cache.
          example: true
        type:
          type: string
          description: Model type the archive was parsed into.
          enum: [Design, FileArchive]
          example: Design
    StepNameList:
      type: object
      description: Names of all steps in a design.
      required: [steps]
      properties:
        steps:
          type: array
          description: Step names (e.g. `pcb`).
          items:
            type: string
          example: [pcb]
    LayerNameList:
      type: object
      description: Names of all layers in a step.
      required: [layers]
      properties:
        layers:
          type: array
          description: Layer names (e.g. `top`, `ground_plane`).
          items:
            type: string
          example: [top, ground_plane, power_plane, bottom]
    SymbolNameList:
      type: object
      description: Names of all symbol directories in a design.
      required: [symbols]
      properties:
        symbols:
          type: array
          description: Symbol names (e.g. `r155`, `pad_square`).
          items:
            type: string
          example: [r155, pad_square]
    NetlistNameList:
      type: object
      description: Names of all netlist files in a step.
      required: [netlists]
      properties:
        netlists:
          type: array
          description: Netlist names (e.g. `cad-net`).
          items:
            type: string
          example: [cad-net]
    PropertyRecord:
      type: object
      description: Generic name/value property (common.proto PropertyRecord).
      properties:
        name:
          type: string
          description: Property name.
        value:
          type: string
          description: Property string value.
        floatValues:
          type: array
          description: Optional list of floating-point values attached to the property.
          items:
            type: number
            format: double
    Color:
      type: object
      description: RGB color (matrixfile.proto Color).
      properties:
        red:
          type: number
          format: float
          description: Red component (0.0 - 1.0).
        green:
          type: number
          format: float
          description: Green component (0.0 - 1.0).
        blue:
          type: number
          format: float
          description: Blue component (0.0 - 1.0).
        noPreference:
          type: boolean
          description: True when no color preference is set.

    # ---------------------------------------------------------------- file model
    FileArchive:
      type: object
      description: Parsed ODB++ file archive (file model root).
      example:
        productName: ODB++ v8
        fileName: sam20200826.tgz
        stepsByName:
          pcb:
            name: pcb
            path: steps/pcb
            layersByName:
              top:
                name: top
                path: steps/pcb/layers/top
              ground_plane:
                name: ground_plane
                path: steps/pcb/layers/ground_plane
        symbolsDirectoriesByName:
          r155:
            name: r155
            path: symbols/r155
        miscInfoFile:
          productModelName: SAM
          jobName: sam20200826
          units: INCH
        matrixFile:
          steps:
            - column: 1
              id: 1
              name: pcb
          layers:
            - row: 1
              context: Board
              type: Signal
              name: top
              polarity: Positive
              cuTop: 3
              cuBottom: 3
        miscAttrListFile:
          directory: misc
          path: misc/attrlist
          attributesByName:
            .-owned-by: ucamco
      properties:
        stepsByName:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/StepDirectory"
          description: Steps keyed by step name.
        miscInfoFile:
          description: Design-level metadata (`misc/info`).
          allOf:
            - $ref: "#/components/schemas/MiscInfoFile"
        matrixFile:
          description: Board stackup (`matrix/matrix`).
          allOf:
            - $ref: "#/components/schemas/MatrixFile"
        standardFontsFile:
          description: Vector stroke font definitions (`fonts/standard`).
          allOf:
            - $ref: "#/components/schemas/StandardFontsFile"
        symbolsDirectoriesByName:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SymbolsDirectory"
          description: Symbol directories keyed by symbol name.
        miscAttrListFile:
          description: Top-level misc attribute list (`misc/attrlist`).
          allOf:
            - $ref: "#/components/schemas/AttrListFile"
        productName:
          type: string
          description: ODB++ internal product name.
        fileName:
          type: string
          description: Source archive file name.

    StepDirectory:
      type: object
      description: A step directory (`steps/<step>/`).
      example:
        name: pcb
        path: steps/pcb
        layersByName:
          top:
            name: top
            path: steps/pcb/layers/top
          ground_plane:
            name: ground_plane
            path: steps/pcb/layers/ground_plane
        netlistsByName:
          cad-net:
            name: cad-net
            path: steps/pcb/netlists/cad-net
            units: INCH
        edadatafile:
          path: steps/pcb/eda/data
          units: INCH
        attrlistfile:
          directory: steps/pcb
          path: steps/pcb/attrlist
        stephdrfile:
          xDatum: 0
          yDatum: 0
          path: steps/pcb/stephdr
      properties:
        name:
          type: string
          description: Step name (e.g. `pcb`).
        path:
          type: string
          description: ODB++ directory path of the step (e.g. `steps/pcb`).
        layersByName:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/LayerDirectory"
          description: Layer directories keyed by layer name.
        netlistsByName:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/NetlistFile"
          description: Netlist files keyed by netlist name.
        edadatafile:
          description: Electrical analysis data (`eda/data`).
          allOf:
            - $ref: "#/components/schemas/EdaDataFile"
        attrlistfile:
          description: Step-level attribute list (`attrlist`).
          allOf:
            - $ref: "#/components/schemas/AttrListFile"
        profilefile:
          description: Step profile outline as a features file (`profile`).
          allOf:
            - $ref: "#/components/schemas/FeaturesFile"
        stephdrfile:
          description: Step header (`stephdr`).
          allOf:
            - $ref: "#/components/schemas/StepHdrFile"

    LayerDirectory:
      type: object
      description: A layer directory (`steps/<step>/layers/<layer>/`).
      example:
        name: top
        path: steps/pcb/layers/top
        components:
          units: INCH
          side: Top
          layerName: top
          path: steps/pcb/layers/top/components
          componentRecords:
            - compName: U1
              partName: 74HC595
              pkgRef: 1
              locationX: 1.25
              locationY: 0.5
              rotation: 90
              id: 1
              index: 1
        featureFile:
          units: INCH
          path: steps/pcb/layers/top/features
          numFeatures: 2
          featureRecords:
            - type: Line
              xs: 0
              ys: 0
              xe: 1.5
              ye: 0
              sym_num: 1
              polarity: Positive
              dcode: 10
              id: 1
            - type: Pad
              x: 0.35
              y: 0.2
              sym_num: 2
              polarity: Positive
              dcode: 11
              id: 2
        attrlistFile:
          directory: steps/pcb/layers/top
          path: steps/pcb/layers/top/attrlist
        toolFile:
          directory: steps/pcb/layers/top
          path: steps/pcb/layers/top/tools
          units: INCH
          tools:
            "1":
              toolNum: 1
              type: Plated
              type2: Standard
              finishSize: 13.5
              drillSize: 14
      properties:
        name:
          type: string
          description: Layer name (e.g. `top`).
        path:
          type: string
          description: ODB++ directory path of the layer (e.g. `steps/pcb/layers/top`).
        components:
          description: Component placement records (`components`).
          allOf:
            - $ref: "#/components/schemas/ComponentsFile"
        attrlistFile:
          description: Layer-level attribute list (`attrlist`).
          allOf:
            - $ref: "#/components/schemas/AttrListFile"
        featureFile:
          description: Layer feature records (`features`).
          allOf:
            - $ref: "#/components/schemas/FeaturesFile"
        toolFile:
          description: Drill tool definitions (`tools`).
          allOf:
            - $ref: "#/components/schemas/ToolsFile"

    SymbolsDirectory:
      type: object
      description: A symbol directory (`symbols/<symbol>/`).
      example:
        name: r155
        path: symbols/r155
        featureFile:
          units: INCH
          path: symbols/r155/features
          numFeatures: 1
          featureRecords:
            - type: Line
              xs: 0
              ys: 0
              xe: 0.155
              ye: 0
              sym_num: 1
              polarity: Positive
              dcode: 10
              id: 1
        attrlistFile:
          directory: symbols/r155
          path: symbols/r155/attrlist
      properties:
        name:
          type: string
          description: Symbol name (e.g. `r155`).
        path:
          type: string
          description: ODB++ directory path of the symbol (e.g. `symbols/r155`).
        attrlistFile:
          description: Symbol-level attribute list (`attrlist`).
          allOf:
            - $ref: "#/components/schemas/AttrListFile"
        featureFile:
          description: Feature records that make up the symbol (`features`).
          allOf:
            - $ref: "#/components/schemas/FeaturesFile"

    MiscInfoFile:
      type: object
      description: "`misc/info` file — design-level metadata."
      example:
        productModelName: SAM
        jobName: sam20200826
        odbVersionMajor: "8"
        odbVersionMinor: "0"
        odbSource: test source
        creationDateDate: "2020-08-26T00:00:00Z"
        saveDate: "2020-08-26T12:00:00Z"
        saveApp: test app
        saveUser: user
        units: INCH
        maxUniqueId: 412
      properties:
        productModelName:
          type: string
          description: ODB++ product model name (e.g. `SAM`).
        jobName:
          type: string
          description: ODB++ job name (e.g. `sam20200826`).
        odbVersionMajor:
          type: string
          description: ODB++ spec major version.
        odbVersionMinor:
          type: string
          description: ODB++ spec minor version.
        odbSource:
          type: string
          description: Free-text source annotation from the `misc/info` file.
        creationDateDate:
          type: string
          format: date-time
          description: Creation date (RFC 3339).
        saveDate:
          type: string
          format: date-time
          description: Last save date (RFC 3339).
        saveApp:
          type: string
          description: Application that last saved the design.
        saveUser:
          type: string
          description: User who last saved the design.
        units:
          type: string
          description: Design units, e.g. `INCH`, `MM`.
          example: INCH
        maxUniqueId:
          type: integer
          format: int32
          description: Highest feature id assigned in the design.

    MatrixFile:
      type: object
      description: "`matrix/matrix` file — board stackup rows/columns."
      example:
        steps:
          - column: 1
            id: 1
            name: pcb
        layers:
          - row: 1
            context: Board
            type: Signal
            name: top
            polarity: Positive
            cuTop: 3
            cuBottom: 3
            ref: 4
            startName: top
            endName: ground_plane
            oldName: top
            addType: ""
          - row: 2
            context: Board
            type: Dielectric
            name: dielectric_1
            polarity: Positive
            dielectricType: Prepreg
            dielectricName: FR-4
            form: Rigid
      properties:
        steps:
          type: array
          description: Step records (one per column of the matrix).
          items:
            $ref: "#/components/schemas/MatrixStepRecord"
        layers:
          type: array
          description: Layer records (one per row of the matrix, in stackup order).
          items:
            $ref: "#/components/schemas/MatrixLayerRecord"
    MatrixStepRecord:
      type: object
      description: One step (column) of the matrix file.
      properties:
        column:
          type: integer
          format: int32
          description: Matrix column number of the step.
        id:
          type: integer
          format: int32
          description: Step id.
        name:
          type: string
          description: Step name.
          example: pcb
    MatrixLayerRecord:
      type: object
      description: One layer (row) of the matrix file.
      properties:
        row:
          type: integer
          format: int32
          description: Matrix row number of the layer (stackup order).
        context:
          type: string
          description: Layer context.
          enum: [Board, Misc]
        type:
          type: string
          description: Layer type.
          enum:
            [Signal, PowerGround, Dielectric, Mixed, SolderMask, SolderPaste,
             SilkScreen, Drill, Rout, Document, Component, Mask, ConductivePaste]
        name:
          type: string
          description: Layer name.
          example: top
        polarity:
          type: string
          description: Layer polarity.
          enum: [Positive, Negative]
        dielectricType:
          type: string
          description: Dielectric material type (dielectric layers only).
          enum: [None, Prepreg, Core]
        dielectricName:
          type: string
          description: Dielectric material name (dielectric layers only).
        form:
          type: string
          description: Board form (rigid or flex).
          enum: [Rigid, Flex]
        cuTop:
          type: integer
          format: int32
          description: Copper weight (top side), percent.
        cuBottom:
          type: integer
          format: int32
          description: Copper weight (bottom side), percent.
        ref:
          type: integer
          format: int32
          description: Row number of the paired layer (e.g. the plane a signal references).
        startName:
          type: string
          description: Name of the layer this record starts from (drill/rout layers).
        endName:
          type: string
          description: Name of the layer this record ends at (drill/rout layers).
        oldName:
          type: string
          description: Previous layer name (before a rename).
        addType:
          type: string
          description: Additional type annotation.
        color:
          description: Layer display color.
          allOf:
            - $ref: "#/components/schemas/Color"
        id:
          type: integer
          format: int32
          description: Layer id.

    AttrListFile:
      type: object
      description: Attribute list file (`attrlist`).
      properties:
        directory:
          type: string
          description: ODB++ directory containing the attrlist file.
        path:
          type: string
          description: ODB++ path of the attrlist file.
        units:
          type: string
          description: Units used by the attrlist file.
        attributesByName:
          type: object
          additionalProperties:
            type: string
          description: Attribute name/value pairs.
          example:
            .-owned-by: ucamco

    StandardFontsFile:
      type: object
      description: "`fonts/standard` file — vector stroke font."
      example:
        xSize: 0.06
        ySize: 0.06
        offset: 0
        mCharacterBlocks:
          - character: A
            mLineRecords:
              - xStart: 0
                yStart: 0
                xEnd: 0.03
                yEnd: 0.06
                polarity: Positive
                shape: Square
                width: 0.006
          - character: B
            mLineRecords:
              - xStart: 0
                yStart: 0
                xEnd: 0.03
                yEnd: 0
                polarity: Positive
                shape: Square
                width: 0.006
      properties:
        xSize:
          type: number
          format: double
          description: Character cell X size.
        ySize:
          type: number
          format: double
          description: Character cell Y size.
        offset:
          type: number
          format: double
          description: Font offset.
        mCharacterBlocks:
          type: array
          description: Stroke definitions per character (field name matches the source model).
          items:
            $ref: "#/components/schemas/CharacterBlock"
    CharacterBlock:
      type: object
      description: Stroke drawing of a single character of the standard font.
      properties:
        character:
          type: string
          description: The character this block draws (e.g. `A`).
        mLineRecords:
          type: array
          description: Line strokes that draw the character.
          items:
            $ref: "#/components/schemas/FontLineRecord"
    FontLineRecord:
      type: object
      description: One stroke line of a character block.
      properties:
        xStart:
          type: number
          format: double
          description: Stroke start X.
        yStart:
          type: number
          format: double
          description: Stroke start Y.
        xEnd:
          type: number
          format: double
          description: Stroke end X.
        yEnd:
          type: number
          format: double
          description: Stroke end Y.
        polarity:
          type: string
          description: Stroke polarity.
          enum: [Positive, Negative]
        shape:
          type: string
          description: Stroke end shape.
          enum: [Square, Round]
        width:
          type: number
          format: double
          description: Stroke width.

    NetlistFile:
      type: object
      description: A netlist file (`netlists/<netlist>`).
      example:
        path: steps/pcb/netlists/cad-net
        name: cad-net
        units: INCH
        optimized: false
        staggered: "No"
        netRecordss:
          - serialNumber: 1
            netName: GND
          - serialNumber: 2
            netName: VCC
        netRecordsByName:
          GND:
            serialNumber: 1
            netName: GND
        netPointRecords:
          - netNumber: 1
            x: 0.5
            y: 0.25
            radius: 0
            side: Top
          - netNumber: 2
            x: 1.0
            y: 0.75
            radius: 0
            side: Top
      properties:
        path:
          type: string
          description: ODB++ path of the netlist file.
        name:
          type: string
          description: Netlist name (e.g. `cad-net`).
        units:
          type: string
          description: Netlist units.
        optimized:
          type: boolean
          description: Whether the netlist has been optimized.
        staggered:
          type: string
          description: Whether the netlist supports staggered test points.
          enum: ["Yes", "No", "Unknown"]
        netRecordss:
          type: array
          description: "Net records (note: field name matches the source model)."
          items:
            $ref: "#/components/schemas/NetlistNetRecord"
        netRecordsByName:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/NetlistNetRecord"
          description: Net records keyed by net name.
        netPointRecords:
          type: array
          description: Net point (test probe location) records.
          items:
            $ref: "#/components/schemas/NetPointRecord"
    NetlistNetRecord:
      type: object
      description: One net of the netlist.
      properties:
        serialNumber:
          type: integer
          format: int32
          description: Net serial number within the netlist.
        netName:
          type: string
          description: Net name.
          example: GND
    NetPointRecord:
      type: object
      description: A net point record — a physical probe/access point of a net.
      properties:
        netNumber:
          type: integer
          format: int32
          description: Serial number of the net this point belongs to.
        radius:
          type: number
          format: double
          description: Point radius.
        x:
          type: number
          format: double
          description: Point X coordinate.
        y:
          type: number
          format: double
          description: Point Y coordinate.
        side:
          type: string
          description: Board side the point is accessed from.
          enum: [Top, Down, Both, Inner]
        width:
          type: number
          format: double
          description: Point width.
        height:
          type: number
          format: double
          description: Point height.
        epoint:
          type: string
          description: E-point annotation.
        exp:
          type: string
          description: Exposure/expand annotation.
        commentPoint:
          type: boolean
          description: True when the point is a comment point.
        staggeredX:
          type: number
          format: double
          description: X coordinate of the staggered probe position.
        staggeredY:
          type: number
          format: double
          description: Y coordinate of the staggered probe position.
        staggeredRadius:
          type: number
          format: double
          description: Radius of the staggered probe position.
        viaPoint:
          type: number
          format: double
          description: Via point marker value.
        fiducialPoint:
          type: number
          format: double
          description: Fiducial point marker value.
        testPoint:
          type: number
          format: double
          description: Test point marker value.
        testExecutionSide:
          type: string
          description: Board side from which the test is executed.

    EdaDataFile:
      type: object
      description: "`eda/data` file — electrical analysis data."
      example:
        path: steps/pcb/eda/data
        units: INCH
        source: cad
        layerNames: [top, bottom]
        netRecords:
          - name: GND
            index: 1
            subnetRecords:
              - type: TOEPRINT
                side: Top
                componentNumber: 1
                toeprintNumber: 1
                index: 1
                featureIdRecords:
                  - type: COPPER
                    layerNumber: 1
                    featureNumber: 1
        packageRecords:
          - name: soic_8
            pitch: 0.05
            xMin: 0
            yMin: 0
            xMax: 0.4
            yMax: 0.2
            pinRecords:
              - name: "1"
                type: Surface
                xCenter: 0.05
                yCenter: 0.05
                electricalType: Electrical
                mountType: Smt
                id: 1
                index: 1
      properties:
        path:
          type: string
          description: ODB++ path of the eda data file.
        units:
          type: string
          description: Eda data units.
        source:
          type: string
          description: Source system the eda data came from.
        layerNames:
          type: array
          description: Names of the layers referenced by the eda data.
          items:
            type: string
        attributeNames:
          type: array
          description: Attribute names defined in the eda data.
          items:
            type: string
        attributeTextValues:
          type: array
          description: Attribute text values defined in the eda data.
          items:
            type: string
        netRecords:
          type: array
          description: Eda net records.
          items:
            $ref: "#/components/schemas/EdaNetRecord"
        netRecordsByName:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/EdaNetRecord"
          description: Eda net records keyed by net name.
        packageRecords:
          type: array
          description: Eda package records.
          items:
            $ref: "#/components/schemas/EdaPackageRecord"
        packageRecordsByName:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/EdaPackageRecord"
          description: Eda package records keyed by package name.
        propertyRecords:
          type: array
          description: File-level property records.
          items:
            $ref: "#/components/schemas/PropertyRecord"
        featureGroupRecords:
          type: array
          description: Feature group records.
          items:
            $ref: "#/components/schemas/EdaFeatureGroupRecord"
    EdaNetRecord:
      type: object
      description: An eda net with its subnets.
      properties:
        name:
          type: string
          description: Net name.
        attributesIdString:
          type: string
          description: Comma-separated attribute ids referencing the attribute lookup table.
        index:
          type: integer
          format: int32
          description: Net index within the eda data.
        subnetRecords:
          type: array
          description: Subnets (vias, traces, planes, toeprints) of the net.
          items:
            $ref: "#/components/schemas/EdaSubnetRecord"
        propertyRecords:
          type: array
          description: Net property records.
          items:
            $ref: "#/components/schemas/PropertyRecord"
        attributeLookupTable:
          type: object
          additionalProperties:
            type: string
          description: Attribute id to value/text mapping.
    EdaSubnetRecord:
      type: object
      description: One subnet of an eda net (via, trace, plane or toeprint).
      properties:
        type:
          type: string
          description: Subnet type.
          enum: [VIA, TRACE, PLANE, TOEPRINT]
        featureIdRecords:
          type: array
          description: Feature ids (layer + feature number) making up the subnet.
          items:
            $ref: "#/components/schemas/EdaFeatureIdRecord"
        fillType:
          type: string
          enum: [SOLID, OUTLINE]
          description: Plane subnets only.
        cutoutType:
          type: string
          enum: [CIRCLE, RECTANGLE, OCTAGON, EXACT]
          description: Plane subnets only.
        fillSize:
          type: number
          format: double
          description: Plane subnets only.
        side:
          type: string
          enum: [BsNone, Top, Bottom]
          description: Toeprint subnets only.
        componentNumber:
          type: integer
          format: int32
          description: Toeprint subnets only.
        toeprintNumber:
          type: integer
          format: int32
          description: Toeprint subnets only.
        index:
          type: integer
          format: int32
          description: Subnet index within the net.
    EdaFeatureIdRecord:
      type: object
      description: Reference to a feature on a layer (copper, laminate or hole).
      properties:
        type:
          type: string
          description: Feature id type.
          enum: [COPPER, LAMINATE, HOLE]
        layerNumber:
          type: integer
          format: int32
          description: Layer (matrix row) number the feature is on.
        featureNumber:
          type: integer
          format: int32
          description: Feature number within the layer's features file.
    EdaPackageRecord:
      type: object
      description: An eda package (footprint) with its pins and outline.
      properties:
        name:
          type: string
          description: Package name.
        pitch:
          type: number
          format: double
          description: Pin pitch of the package.
        xMin:
          type: number
          format: double
          description: Bounding box minimum X.
        yMin:
          type: number
          format: double
          description: Bounding box minimum Y.
        xMax:
          type: number
          format: double
          description: Bounding box maximum X.
        yMax:
          type: number
          format: double
          description: Bounding box maximum Y.
        attributesIdString:
          type: string
          description: Comma-separated attribute ids referencing the attribute lookup table.
        pinRecords:
          type: array
          description: Package pin records.
          items:
            $ref: "#/components/schemas/EdaPinRecord"
        pinRecordsByName:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/EdaPinRecord"
          description: Package pin records keyed by pin name.
        propertyRecords:
          type: array
          description: Package property records.
          items:
            $ref: "#/components/schemas/PropertyRecord"
        outlineRecords:
          type: array
          description: Package outline records.
          items:
            $ref: "#/components/schemas/EdaOutlineRecord"
        attributeLookupTable:
          type: object
          additionalProperties:
            type: string
          description: Attribute id to value/text mapping.
    EdaPinRecord:
      type: object
      description: One pin of an eda package.
      properties:
        name:
          type: string
          description: Pin name/number.
        type:
          type: string
          description: Pin hole/surface type.
          enum: [ThroughHole, Blind, Surface]
        xCenter:
          type: number
          format: double
          description: Pin center X.
        yCenter:
          type: number
          format: double
          description: Pin center Y.
        finishedHoleSize:
          type: number
          format: double
          description: Unused (always 0).
        electricalType:
          type: string
          description: Whether the pin is electrical.
          enum: [Electrical, NonElectrical, Undefined]
        mountType:
          type: string
          description: Pin mount type.
          enum:
            [Smt, RecommendedSmtPad, MT_ThroughHole, RecommendedThroughHole,
             PressFit, NonBoard, Hole, MT_Undefined]
        id:
          type: integer
          format: int32
          description: Pin id.
        index:
          type: integer
          format: int32
          description: Pin index within the package.
    EdaOutlineRecord:
      type: object
      description: One outline shape of an eda package.
      properties:
        type:
          type: string
          description: Outline shape type.
          enum: [Rectangle, Circle, Square, Contour]
        lowerLeftX:
          type: number
          format: double
          description: Lower-left corner X (rectangle outlines).
        lowerLeftY:
          type: number
          format: double
          description: Lower-left corner Y (rectangle outlines).
        width:
          type: number
          format: double
          description: Outline width.
        height:
          type: number
          format: double
          description: Outline height.
        xCenter:
          type: number
          format: double
          description: Outline center X.
        yCenter:
          type: number
          format: double
          description: Outline center Y.
        halfSide:
          type: number
          format: double
          description: Half side length (square outlines).
        radius:
          type: number
          format: double
          description: Outline radius (circle outlines).
        contourPolygons:
          type: array
          description: Contour polygons (contour outlines).
          items:
            $ref: "#/components/schemas/ContourPolygon"
    EdaFeatureGroupRecord:
      type: object
      description: A named group of features in the eda data.
      properties:
        type:
          type: string
          description: Feature group type.
        propertyRecords:
          type: array
          description: Group property records.
          items:
            $ref: "#/components/schemas/PropertyRecord"
        featureIdRecords:
          type: array
          description: Feature ids belonging to the group.
          items:
            $ref: "#/components/schemas/EdaFeatureIdRecord"

    StepHdrFile:
      type: object
      description: "`stephdr` file — step header."
      example:
        xDatum: 0
        yDatum: 0
        id: 1
        xOrigin: 0
        yOrigin: 0
        topActive: 10
        bottomActive: 0
        rightActive: 8
        leftActive: 0
        stepRepeatRecords: []
        path: steps/pcb/stephdr
      properties:
        xDatum:
          type: number
          format: double
          description: Datum (origin for absolute coordinates) X.
        yDatum:
          type: number
          format: double
          description: Datum (origin for absolute coordinates) Y.
        id:
          type: integer
          format: int32
          description: Step header id.
        xOrigin:
          type: number
          format: double
          description: Step origin X.
        yOrigin:
          type: number
          format: double
          description: Step origin Y.
        topActive:
          type: number
          format: double
          description: Active (board) area top edge Y.
        bottomActive:
          type: number
          format: double
          description: Active (board) area bottom edge Y.
        rightActive:
          type: number
          format: double
          description: Active (board) area right edge X.
        leftActive:
          type: number
          format: double
          description: Active (board) area left edge X.
        affectingBom:
          type: string
          description: BOM affected by this step.
        affectingBomChanged:
          type: boolean
          description: True when the affecting BOM has changed.
        online:
          type: string
          description: Raw `online` flag value from the stephdr file.
        stepRepeatRecords:
          type: array
          description: Step-and-repeat records (panelized copies of sub-steps).
          items:
            $ref: "#/components/schemas/StepRepeatRecord"
        path:
          type: string
          description: ODB++ path of the stephdr file.
        onlineValues:
          type: object
          additionalProperties:
            type: string
          description: Online flag values keyed by attribute name.
    StepRepeatRecord:
      type: object
      description: One step-and-repeat entry of the step header.
      properties:
        name:
          type: string
          description: Repeated (sub-)step name.
        x:
          type: number
          format: double
          description: Repeat origin X.
        y:
          type: number
          format: double
          description: Repeat origin Y.
        dx:
          type: number
          format: double
          description: X spacing between repeats.
        dy:
          type: number
          format: double
          description: Y spacing between repeats.
        nx:
          type: integer
          format: int32
          description: Number of repeats in X.
        ny:
          type: integer
          format: int32
          description: Number of repeats in Y.
        angle:
          type: number
          format: double
          description: Rotation in degrees.
        flip:
          type: boolean
          description: True when the repeat is flipped.
        mirror:
          type: boolean
          description: True when the repeat is mirrored.

    FeaturesFile:
      type: object
      description: A features file (`features` or step `profile`).
      example:
        units: INCH
        id: 1
        path: steps/pcb/layers/top/features
        directory: steps/pcb/layers/top
        numFeatures: 3
        featureRecords:
          - type: Line
            xs: 0
            ys: 0
            xe: 1.5
            ye: 0
            sym_num: 1
            polarity: Positive
            dcode: 10
            id: 1
          - type: Pad
            x: 0.35
            y: 0.2
            sym_num: 2
            polarity: Positive
            dcode: 11
            id: 2
          - type: Text
            x: 0.1
            y: 0.9
            font: standard
            text: REFDES
            xsize: 0.05
            ysize: 0.05
            polarity: Positive
            dcode: 12
            id: 3
        symbolNames:
          - name: r155
            unitType: Imperial
          - name: pad_square
            unitType: None
        symbolNamesByName:
          r155:
            name: r155
            unitType: Imperial
          pad_square:
            name: pad_square
            unitType: None
      properties:
        units:
          type: string
          description: Features file units (e.g. `INCH`, `MM`).
          example: INCH
        id:
          type: integer
          format: int32
          description: Features file id.
        path:
          type: string
          description: ODB++ path of the features file.
        directory:
          type: string
          description: ODB++ directory containing the features file.
        numFeatures:
          type: integer
          format: int32
          description: Number of feature records in the file.
        featureRecords:
          type: array
          description: The drawn feature records (arcs, pads, surfaces, barcodes, texts, lines).
          items:
            $ref: "#/components/schemas/FeatureRecord"
        symbolNamesByName:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SymbolNameRecord"
          description: Referenced symbols keyed by symbol name.
        symbolNames:
          type: array
          description: Referenced symbols (name + unit type).
          items:
            $ref: "#/components/schemas/SymbolNameRecord"
    FeatureRecord:
      type: object
      description: |
        A single drawn feature. Which coordinate fields are meaningful depends on `type`:
        lines/arcs use start/end/center, pads use center + symbol reference, surfaces use
        contour polygons, texts use position + font + size.
      properties:
        type:
          type: string
          description: Feature type.
          enum: [Arc, Pad, Surface, Barcode, Text, Line]
        xs:
          type: number
          format: double
          description: Start X.
        ys:
          type: number
          format: double
          description: Start Y.
        xe:
          type: number
          format: double
          description: End X (lines/arcs).
        ye:
          type: number
          format: double
          description: End Y (lines/arcs).
        x:
          type: number
          format: double
          description: Center X (pads/texts).
        y:
          type: number
          format: double
          description: Center Y (pads/texts).
        apt_def:
          type: integer
          format: int32
          description: aperture_def reference (resize/aperture definition id).
        apt_def_symbol_num:
          type: integer
          format: int32
          description: Symbol number of the aperture definition.
        apt_def_resize_factor:
          type: number
          format: double
          description: Resize factor applied by the aperture definition.
        xc:
          type: number
          format: double
          description: Arc center X.
        yc:
          type: number
          format: double
          description: Arc center Y.
        cw:
          type: boolean
          description: Arc direction (clockwise).
        font:
          type: string
          description: Text font name.
        xsize:
          type: number
          format: double
          description: Text X size.
        ysize:
          type: number
          format: double
          description: Text Y size.
        width_factor:
          type: number
          format: double
          description: Text width factor.
        text:
          type: string
          description: Text content (for `Text` features).
        version:
          type: integer
          format: int32
          description: Feature record version.
        sym_num:
          type: integer
          format: int32
          description: Symbol number (pads/lines).
        polarity:
          type: string
          description: Feature polarity.
          enum: [Positive, Negative]
        dcode:
          type: integer
          format: int32
          description: Gerber D-code of the feature.
        atr:
          type: integer
          format: int32
          description: Attribute reference id.
        value:
          type: string
          description: Feature value annotation (e.g. barcode content).
        id:
          type: integer
          format: int32
          description: Feature id.
        orient_def:
          type: integer
          format: int32
          description: Orientation definition id.
        orient_def_rotation:
          type: number
          format: double
          description: Orientation definition rotation in degrees.
        contourPolygons:
          type: array
          description: Contour polygons (for `Surface` features).
          items:
            $ref: "#/components/schemas/ContourPolygon"
        attributeLookupTable:
          type: object
          additionalProperties:
            type: string
          description: Attribute id to value/text mapping.
    ContourPolygon:
      type: object
      description: One closed contour (island or hole) of a surface.
      properties:
        type:
          type: string
          description: Whether the contour is copper (island) or a cutout (hole).
          enum: [Island, Hole]
        xStart:
          type: number
          format: double
          description: Contour start point X.
        yStart:
          type: number
          format: double
          description: Contour start point Y.
        polygonParts:
          type: array
          description: Segments/arcs tracing the contour boundary.
          items:
            $ref: "#/components/schemas/PolygonPart"
    PolygonPart:
      type: object
      description: One segment or arc of a contour polygon.
      properties:
        type:
          type: string
          description: Part type.
          enum: [Segment, Arc]
        endX:
          type: number
          format: double
          description: Part end point X.
        endY:
          type: number
          format: double
          description: Part end point Y.
        xCenter:
          type: number
          format: double
          description: Arc center X (for `Arc` parts).
        yCenter:
          type: number
          format: double
          description: Arc center Y (for `Arc` parts).
        isClockwise:
          type: boolean
          description: Arc direction (for `Arc` parts).
    SymbolNameRecord:
      type: object
      description: Symbol reference (symbols directory name + its unit type).
      properties:
        name:
          type: string
          description: Symbol name (symbols directory name).
          example: r155
        unitType:
          type: string
          description: Unit type of the symbol's coordinates.
          enum: [None, Metric, Imperial]

    ComponentsFile:
      type: object
      description: Layer components file (`layers/<layer>/components`).
      example:
        units: INCH
        id: 1
        side: Top
        layerName: top
        path: steps/pcb/layers/top/components
        directory: steps/pcb/layers/top
        componentRecords:
          - compName: U1
            partName: 74HC595
            pkgRef: 1
            locationX: 1.25
            locationY: 0.5
            rotation: 90
            id: 1
            index: 1
            toeprintRecords:
              - pinNumber: 1
                locationX: 1.2
                locationY: 0.55
                netNumber: 1
                name: "1"
          - compName: R1
            partName: RES-10K-0402
            pkgRef: 2
            locationX: 2
            locationY: 1
            rotation: 0
            id: 2
            index: 2
        bomDescriptionRecordsByCpn:
          "74HC595":
            cpn: "74HC595"
            pkg: soic_8
            mpn: SN74HC595N
            vnd: Texas Instruments
      properties:
        units:
          type: string
          description: Components file units.
        id:
          type: integer
          format: int32
          description: Components file id.
        side:
          type: string
          description: Board side the layer's components are placed on.
          enum: [BsNone, Top, Bottom]
        layerName:
          type: string
          description: Name of the layer this components file belongs to.
        path:
          type: string
          description: ODB++ path of the components file.
        directory:
          type: string
          description: ODB++ directory containing the components file.
        attributeNames:
          type: array
          description: Attribute names defined in the components file.
          items:
            type: string
        attributeTextValues:
          type: array
          description: Attribute text values defined in the components file.
          items:
            type: string
        componentRecords:
          type: array
          description: Component placement records.
          items:
            $ref: "#/components/schemas/ComponentRecord"
        componentRecordsByName:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ComponentRecord"
          description: Component records keyed by component (refdes) name.
        propertyRecords:
          type: array
          description: File-level property records.
          items:
            $ref: "#/components/schemas/PropertyRecord"
        propertyRecordsByName:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PropertyRecord"
          description: File-level property records keyed by property name.
        bomDescriptionRecordsByCpn:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/BomDescriptionRecord"
          description: BOM description records keyed by company part number.
    ComponentRecord:
      type: object
      description: One placed component on the layer.
      properties:
        pkgRef:
          type: integer
          format: int32
          description: Package id (references the eda package for the component).
        locationX:
          type: number
          format: double
          description: Placement X coordinate.
        locationY:
          type: number
          format: double
          description: Placement Y coordinate.
        rotation:
          type: number
          format: double
          description: Placement rotation in degrees.
        mirror:
          type: boolean
          description: True when the component is mirrored.
        compName:
          type: string
          description: Component reference designator.
          example: U1
        partName:
          type: string
          description: Part name (part number) of the component.
        attributes:
          type: string
          description: Raw attribute string of the component.
        id:
          type: integer
          format: int32
          description: Component id.
        index:
          type: integer
          format: int32
          description: Component index (component number) within the file.
        propertyRecords:
          type: array
          description: Component property records.
          items:
            $ref: "#/components/schemas/PropertyRecord"
        toeprintRecords:
          type: array
          description: Toeprints (pin land patterns) of the component on this layer.
          items:
            $ref: "#/components/schemas/ToeprintRecord"
        attributeLookupTable:
          type: object
          additionalProperties:
            type: string
          description: Attribute id to value/text mapping.
    ToeprintRecord:
      type: object
      description: A component pin's land pattern on this layer.
      properties:
        pinNumber:
          type: integer
          format: int32
          description: Pin number of the component the toeprint belongs to.
        locationX:
          type: number
          format: double
          description: Toeprint center X.
        locationY:
          type: number
          format: double
          description: Toeprint center Y.
        rotation:
          type: number
          format: double
          description: Toeprint rotation in degrees.
        mirror:
          type: boolean
          description: True when the toeprint is mirrored.
        netNumber:
          type: integer
          format: int32
          description: Serial number of the net connected to the pin.
        subnetNumber:
          type: integer
          format: int32
          description: Number of the subnet connected to the pin.
        name:
          type: string
          description: Toeprint (pin) name.
    BomDescriptionRecord:
      type: object
      description: BOM description record for a company part number.
      properties:
        cpn:
          type: string
          description: Company part number.
        pkg:
          type: string
          description: Package name.
        ipn:
          type: string
          description: Internal part number.
        descriptions:
          type: array
          description: Free-text part descriptions.
          items:
            type: string
        vpl_vnd:
          type: string
          description: Vendor list price vendor.
        vpl_mpn:
          type: string
          description: Vendor list price manufacturer part number.
        vnd:
          type: string
          description: Vendor name.
        mpn:
          type: string
          description: Manufacturer part number.

    ToolsFile:
      type: object
      description: Layer tools file (`layers/<layer>/tools`) — drill tool definitions.
      example:
        directory: steps/pcb/layers/drill
        path: steps/pcb/layers/drill/tools
        units: MM
        thickness: 1.6
        tools:
          "1":
            toolNum: 1
            type: Plated
            type2: Standard
            minTol: -0.05
            maxTol: 0.05
            finishSize: 0.3
            drillSize: 0.3
          "2":
            toolNum: 2
            type: Via
            type2: Laser
            finishSize: 0.1
            drillSize: 0.1
      properties:
        directory:
          type: string
          description: ODB++ directory containing the tools file.
        path:
          type: string
          description: ODB++ path of the tools file.
        units:
          type: string
          description: Tools file units.
        thickness:
          type: number
          format: double
          description: Board thickness for depth-controlled tools.
        userParams:
          type: string
          description: Raw user parameter string from the tools file.
        tools:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ToolsRecord"
          description: Tool records keyed by tool number.
    ToolsRecord:
      type: object
      description: One drill tool definition.
      properties:
        toolNum:
          type: integer
          format: int32
          description: Tool number.
        type:
          type: string
          description: Plating type of the tool.
          enum: [Plated, NonPlated, Via]
        type2:
          type: string
          description: Tool technology.
          enum: [Standard, PressFit, Photo, Laser]
        minTol:
          type: number
          format: double
          description: Minimum size tolerance of the finished hole.
        maxTol:
          type: number
          format: double
          description: Maximum size tolerance of the finished hole.
        drillBit:
          type: string
          description: Drill bit identifier.
        finishSize:
          type: number
          format: double
          description: Finished hole size.
        drillSize:
          type: number
          format: double
          description: Drill (bit) size.

    # ------------------------------------------------------------- diagnostics
    SymbolUnitsDiagnostics:
      type: object
      description: Symbol unit-type analysis for a step (server-built JSON, snake_case keys).
      required: [design, step, layers]
      properties:
        design:
          type: string
          description: Design name the analysis ran for.
        step:
          type: string
          description: Step name the analysis ran for.
        layers:
          type: array
          description: Per-layer symbol unit analysis.
          items:
            $ref: "#/components/schemas/LayerSymbolUnits"
    LayerSymbolUnits:
      type: object
      description: Symbol unit-type analysis for one layer.
      properties:
        layer:
          type: string
          description: Layer name.
        features_units_raw:
          type: string
          description: Raw units string from the layer features file.
          example: INCH
        symbols_total:
          type: integer
          description: Total number of symbols referenced by the layer.
        symbol_unit_counts:
          type: object
          description: Number of referenced symbols per unit type.
          properties:
            metric:
              type: integer
              description: Count of symbols with metric unit type.
            imperial:
              type: integer
              description: Count of symbols with imperial unit type.
            none:
              type: integer
              description: Count of symbols with no unit type.
        has_mixed_symbol_unit_types:
          type: boolean
          description: True when both metric and imperial symbols are present.
        has_mismatch_vs_features_units:
          type: boolean
          description: True when a symbol unit type contradicts the features file units.

    # ------------------------------------------------------------ product model
    Design:
      type: object
      description: Aggregated product model for a design.
      example:
        productModel: SAM
        name: sam20200826.tgz
        nets:
          - name: GND
            index: 1
            pinConnections:
              - name: U1-1
                component:
                  refDes: U1
                pin:
                  name: "1"
                  index: 1
          - name: VCC
            index: 2
            pinConnections:
              - name: U1-8
                component:
                  refDes: U1
                pin:
                  name: "8"
                  index: 8
        netsByName:
          GND:
            name: GND
            index: 1
          VCC:
            name: VCC
            index: 2
        packages:
          - name: soic_8
            index: 1
            pins:
              - name: "1"
                index: 1
        packagesByName:
          soic_8:
            name: soic_8
            index: 1
        components:
          - refDes: U1
            partName: 74HC595
            index: 1
            side: Top
            package:
              name: soic_8
        componentsByName:
          U1:
            refDes: U1
            partName: 74HC595
            index: 1
            side: Top
        parts:
          - name: RES-10K-0402
        partsByName:
          RES-10K-0402:
            name: RES-10K-0402
      properties:
        productModel:
          type: string
          description: Source product model name.
        name:
          type: string
          description: Design name.
        fileModel:
          description: Embedded file model (present only when `include_filearchive=true`).
          allOf:
            - $ref: "#/components/schemas/FileArchive"
        nets:
          type: array
          description: The design's nets.
          items:
            $ref: "#/components/schemas/Net"
        netsByName:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Net"
          description: Nets keyed by net name.
        packages:
          type: array
          description: The design's packages.
          items:
            $ref: "#/components/schemas/Package"
        packagesByName:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Package"
          description: Packages keyed by package name.
        components:
          type: array
          description: The design's placed components.
          items:
            $ref: "#/components/schemas/Component"
        componentsByName:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Component"
          description: Components keyed by reference designator.
        parts:
          type: array
          description: The design's parts (part numbers).
          items:
            $ref: "#/components/schemas/Part"
        partsByName:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Part"
          description: Parts keyed by part number.
    Component:
      type: object
      description: Placed component in the product model.
      properties:
        refDes:
          type: string
          description: Reference designator.
          example: U1
        partName:
          type: string
          description: Part name (part number) of the component.
        package:
          description: Package (land pattern) of the component.
          allOf:
            - $ref: "#/components/schemas/Package"
        index:
          type: integer
          format: int32
          description: Component index (component number) within the design.
        side:
          type: string
          description: Board side the component is placed on.
          enum: [BsNone, Top, Bottom]
        part:
          description: Part (part number) of the component.
          allOf:
            - $ref: "#/components/schemas/Part"
    Net:
      type: object
      description: Electrical net with its pin connections.
      properties:
        name:
          type: string
          description: Net name.
          example: GND
        pinConnections:
          type: array
          description: Component pin connections on the net.
          items:
            $ref: "#/components/schemas/PinConnection"
        index:
          type: integer
          format: int32
          description: Net index within the design.
    PinConnection:
      type: object
      description: One component pin's connection to a net.
      properties:
        name:
          type: string
          description: Pin connection name (e.g. `U1-1`).
        component:
          description: The connected component.
          allOf:
            - $ref: "#/components/schemas/Component"
        pin:
          description: The connected package pin.
          allOf:
            - $ref: "#/components/schemas/Pin"
    Pin:
      type: object
      description: One pin of a package.
      properties:
        name:
          type: string
          description: Pin name/number.
        index:
          type: integer
          format: int32
          description: Pin index within the package.
    Package:
      type: object
      description: Component package (land pattern) with its pins.
      properties:
        name:
          type: string
          description: Package name.
        pins:
          type: array
          description: The package's pins.
          items:
            $ref: "#/components/schemas/Pin"
        pinsByName:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Pin"
          description: Pins keyed by pin name.
        index:
          type: integer
          format: int32
          description: Package index within the design.
    Part:
      type: object
      description: A part number referenced by components.
      properties:
        name:
          type: string
          description: Part number.
          example: RES-10K-0402
