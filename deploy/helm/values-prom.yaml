# kube-prometheus-stack overrides.
# Grafana and Prometheus are exposed on the same host/port as Traefik (see create-k3d-cluster / local-ingress).

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: true
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    # Do NOT set routePrefix to a subpath here: Prometheus must serve /api/v1 at the
    # Service root (port 9090) so Freelens/Lens and Grafana’s datasource work in-cluster.
    # External URL http://precision5820:8081/prometheus uses Traefik StripPrefix (see
    # deploy/kube/traefik-middleware-prometheus-stripprefix.yaml + ingress annotations).
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: monitoring-prometheus-stripprefix@kubernetescrd
    hosts:
      - precision5820
    paths:
      - /prometheus
    pathType: Prefix

grafana:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - precision5820
    path: /grafana
  # Required when serving Grafana behind a sub-path (same Traefik entrypoint as :8081).
  grafana.ini:
    server:
      root_url: http://precision5820:8081/grafana/
      serve_from_sub_path: true
