          summary: Get a symbol's features file
          description: Returns the feature records that make up the symbol.
          parameters:
            - $ref: "#/components/parameters/DesignNameParam"
            - $ref: "#/components/parameters/SymbolNameParam"
          responses:
            "200":
              description: Features file.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/FeaturesFile"
            "400":
              $ref: "#/components/responses/BadRequest"
            "401":
              $ref: "#/components/responses/Unauthorized"
            "404":
              $ref: "#/components/responses/NotFound"
            "500":
              $ref: "#/components/responses/InternalError"

      /filemodels/{name}/symbols/{symbol}/attrlist:
        get:
          tags: [symbols]
          operationId: getSymbolAttrList
          summary: Get a symbol's attribute list file
          description: Returns the symbol-level `attrlist` file.
          parameters:
            - $ref: "#/components/parameters/DesignNameParam"
            - $ref: "#/components/parameters/SymbolNameParam"
          responses:
            "200":
              description: Attrlist file.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/AttrListFile"
            "400":
              $ref: "#/components/responses/BadRequest"
            "401":
              $ref: "#/components/responses/Unauthorized"
            "404":
              $ref: "#/components/responses/NotFound"
            "500":
              $ref: "#/components/responses/InternalError"

      /designs:
        get:
          tags: [designs]
          operationId: listDesigns
          summary: List design archives and their load state
          description: |
            Same listing as `GET /files/list` and `GET /filemodels`. Returns `204 No Content`
            when the designs directory is empty.
          responses:
            "200":
              description: Archives found.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/FileArchiveList"
            "204":
              description: Designs directory is empty (no body).
            "401":
              $ref: "#/components/responses/Unauthorized"
            "500":
              $ref: "#/components/responses/InternalError"

      /designs/{name}:
        get:
          tags: [designs]
          operationId: getDesign
          summary: Get the product model for a design
          description: |
            Returns the aggregated **Design** product model: nets, packages, components and parts
            (with their cross-references). By default the embedded file model is *clipped*
            (removed) to reduce payload size; pass `include_filearchive=true` to keep it.
          parameters:
            - $ref: "#/components/parameters/DesignNameParam"
            - name: include_filearchive
              in: query
              required: false
              description: |
                Include the full embedded file model in the response. Accepted values: `true`,
                `yes` (any other value is treated as false).
              schema:
                type: string
                enum: [true, yes]
              example: true
          responses:
            "200":
              description: Design product model.
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/Design"
            "400":
              $ref: "#/components/responses/BadRequest"
            "401":
              $ref: "#/components/responses/Unauthorized"
            "404":
              $ref: "#/components/responses/NotFound"
            "500":
              $ref: "#/components/responses/InternalError"

      /designs/{name}/components:
        get:
          tags: [designs]
          operationId: getDesignComponents
          summary: Get a design's components
          description: Returns the design's component list (refdes, part, package, board side).
          parameters:
            - $ref: "#/components/parameters/DesignNameParam"
          responses:
            "200":
              description: Components array.
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: "#/components/schemas/Component"
            "400":
              $ref: "#/components/responses/BadRequest"
            "401":
              $ref: "#/components/responses/Unauthorized"
            "404":
              $ref: "#/components/responses/NotFound"
            "500":
              $ref: "#/components/responses/InternalError"

      /designs/{name}/nets:
        get:
          tags: [designs]
          operationId: getDesignNets
          summary: Get a design's nets
          description: Returns the design's net list with pin connections.
          parameters:
            - $ref: "#/components/parameters/DesignNameParam"
          responses:
            "200":
              description: Nets array.
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: "#/components/schemas/Net"
            "400":
              $ref: "#/components/responses/BadRequest"
            "401":
              $ref: "#/components/responses/Unauthorized"
            "404":
              $ref: "#/components/responses/NotFound"
            "500":
              $ref: "#/components/responses/InternalError"

      /designs/{name}/packages:
        get:
          tags: [designs]
          operationId: getDesignPackages
          summary: Get a design's packages
          description: Returns the design's package list with pin definitions.
          parameters:
            - $ref: "#/components/parameters/DesignNameParam"
          responses:
            "200":
              description: Packages array.
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: "#/components/schemas/Package"
            "400":
              $ref: "#/components/responses/BadRequest"
            "401":
              $ref: "#/components/responses/Unauthorized"
            "404":
              $ref: "#/components/responses/NotFound"
            "500":
              $ref: "#/components/responses/InternalError"

      /designs/{name}/parts:
        get:
          tags: [designs]
          operationId: getDesignParts
          summary: Get a design's parts
          description: Returns the design's part (part-number) list.
          parameters:
            - $ref: "#/components/parameters/DesignNameParam"
          responses:
            "200":
              description: Parts array.
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: "#/components/schemas/Part"
            "400":
              $ref: "#/components/responses/BadRequest"
            "401":
              $ref: "#/components/responses/Unauthorized"
            "404":
              $ref: "#/components/responses/NotFound"
            "500":
              $ref: "#/components/responses/InternalError"

      /healthz/live:
        get:
          tags: [health check]
          operationId: healthLive
          summary: Liveness probe
          description: Returns `200` with a plain-text body when the server process is alive.
          security: []
          responses:
            "200":
              description: Server is alive.
              content:
                text/plain:
                  schema:
                    type: string
                  example: "healthy: live"

      /healthz/started:
        get:
          tags: [health check]
          operationId: healthStarted
          summary: Startup probe
          description: Returns `200` once the server has finished starting up.
          security: []
          responses:
            "200":
              description: Server has started.
              content:
                text/plain:
                  schema:
                    type: string
                  example: "healthy: started"

      /healthz/ready:
        get:
          tags: [health check]
          operationId: healthReady
          summary: Readiness probe
          description: Returns `200` when the server is ready to accept requests.
          security: []
          responses:
            "200":
              description: Server is ready.
              content:
                text/plain:
                  schema:
                    type: string
                  example: "healthy: ready"

      /helloworld:
        get:
          tags: [hello world]
          operationId: helloWorld
          summary: Hello world demo page
          description: Renders the `helloworld.html` mustache template (unauthenticated demo).
          security: []
          responses:
            "200":
              description: HTML page.
              content:
                text/html:
                  schema:
                    type: string

      /hellodesign/{name}:
        get:
          tags: [hello world]
          operationId: helloDesign
          summary: Hello design demo page
          description: |
            Renders the `helloworld.html` mustache template with `{design}` substituted by the
            given name (unauthenticated demo).
          security: []
          parameters:
            - $ref: "#/components/parameters/DesignNameParam"
          responses:
            "200":
              description: HTML page.
              content:
                text/html:
                  schema:
                    type: string

    components:
      securitySchemes:
        BasicAuth:
          type: http
          scheme: basic
          description: |
            HTTP Basic authentication. The server's credentials are set at startup via the
            `ODBDESIGN_SERVER_REQUEST_USERNAME` / `ODBDESIGN_SERVER_REQUEST_PASSWORD`
            environment variables.

      parameters:
        DesignNameParam:
          name: name
          in: path
          required: true
          description: Design (archive) name, without directory — e.g. `sam20200826.tgz`.
          schema:
            type: string
          example: sam20200826.tgz
        FileNameParam:
          name: name
          in: path
          required: true
          description: File name to store the uploaded archive as (e.g. `mydesign.tgz`).
          schema:
            type: string
          example: mydesign.tgz
        StepNameParam:
          name: step
          in: path
          required: true
          description: Step name — e.g. `pcb`.
          schema:
            type: string
          example: pcb
        LayerNameParam:
          name: layer
          in: path
          required: true
          description: Layer name — e.g. `top`, `ground_plane`, `solder_mask_top`.
          schema:
            type: string
          example: top
        SymbolNameParam:
          name: symbol
          in: path
          required: true
          description: Symbol name — e.g. `r155`, `pad_square`.
          schema:
            type: string
          example: r155
        NetlistNameParam:
          name: netlist
          in: path
          required: true
          description: Netlist name — e.g. `cad-net`.
          schema:
            type: string
          example: cad-net

      responses:
        Unauthorized:
          description: Missing or invalid HTTP Basic credentials.
          content:
            text/plain:
              schema:
                type: string
              example: Unauthorized
        BadRequest:
          description: Malformed request (e.g. empty/invalid name, unsupported content type).
          content:
            text/plain:
              schema:
                type: string
              example: design name not specified
        NotFound:
          description: Named resource (design / step / layer / symbol / netlist) not found.
          content:
            text/plain:
              schema:
                type: string
              example: 'design: "sam20200826.tgz" not found'
        InternalError:
          description: Internal server error (e.g. file handling failure or unconfigured credentials).
          content:
            text/plain:
              schema:
                type: string
              example: failed handling new file

      schemas:
        # ------------------------------------------------------------------ common
        FileArchiveList:
          type: object
          description: Listing of design archives known to the server.
          required: [filearchives]
          properties:
            filearchives:
              type: array
              items:
                $ref: "#/components/schemas/FileArchiveEntry"
        FileArchiveEntry:
          type: object
          description: One archive in the designs directory and its load state.
          properties:
            name:
              type: string
              description: Archive file name.
              example: sam20200826.tgz
            loaded:
              type: boolean
              description: Whether the archive has been parsed into the server cache.
              example: true
            type:
              type: string
              description: Model type the archive was parsed into.
              enum: [Design, FileArchive]
              example: Design
        StepNameList:
          type: object
          required: [steps]
          properties:
            steps:
              type: array
              items:
                type: string
              example: [pcb]
        LayerNameList:
          type: object
          required: [layers]
          properties:
            layers:
              type: array
              items:
                type: string
              example: [top, ground_plane, power_plane, bottom]
        SymbolNameList:
          type: object
          required: [symbols]
          properties:
            symbols:
              type: array
              items:
                type: string
              example: [r155, pad_square]
        NetlistNameList:
          type: object
          required: [netlists]
          properties:
            netlists:
              type: array
              items:
                type: string
              example: [cad-net]
        PropertyRecord:
          type: object
          description: Generic name/value property (common.proto PropertyRecord).
          properties:
            name:
              type: string
            value:
              type: string
            floatValues:
              type: array
              items:
                type: number
                format: double
        Color:
          type: object
          properties:
            red:
              type: number
              format: float
            green:
              type: number
              format: float
            blue:
              type: number
              format: float
            noPreference:
              type: boolean

        # ---------------------------------------------------------------- file model
        FileArchive:
          type: object
          description: Parsed ODB++ file archive (file model root).
          properties:
            stepsByName:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/StepDirectory"
              description: Steps keyed by step name.
            miscInfoFile:
              $ref: "#/components/schemas/MiscInfoFile"
            matrixFile:
              $ref: "#/components/schemas/MatrixFile"
            standardFontsFile:
              $ref: "#/components/schemas/StandardFontsFile"
            symbolsDirectoriesByName:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/SymbolsDirectory"
              description: Symbol directories keyed by symbol name.
            miscAttrListFile:
              $ref: "#/components/schemas/AttrListFile"
            productName:
              type: string
              description: ODB++ internal product name.
            fileName:
              type: string
              description: Source archive file name.

        StepDirectory:
          type: object
          description: A step directory (`steps/<step>/`).
          properties:
            name:
              type: string
            path:
              type: string
            layersByName:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/LayerDirectory"
            netlistsByName:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/NetlistFile"
            edadatafile:
              $ref: "#/components/schemas/EdaDataFile"
            attrlistfile:
              $ref: "#/components/schemas/AttrListFile"
            profilefile:
              $ref: "#/components/schemas/FeaturesFile"
            stephdrfile:
              $ref: "#/components/schemas/StepHdrFile"

        LayerDirectory:
          type: object
          description: A layer directory (`steps/<step>/layers/<layer>/`).
          properties:
            name:
              type: string
            path:
              type: string
            components:
              $ref: "#/components/schemas/ComponentsFile"
            attrlistFile:
              $ref: "#/components/schemas/AttrListFile"
            featureFile:
              $ref: "#/components/schemas/FeaturesFile"
            toolFile:
              $ref: "#/components/schemas/ToolsFile"

        SymbolsDirectory:
          type: object
          description: A symbol directory (`symbols/<symbol>/`).
          properties:
            name:
              type: string
            path:
              type: string
            attrlistFile:
              $ref: "#/components/schemas/AttrListFile"
            featureFile:
              $ref: "#/components/schemas/FeaturesFile"

        MiscInfoFile:
          type: object
          description: "`misc/info` file — design-level metadata."
          properties:
            productModelName:
              type: string
            jobName:
              type: string
            odbVersionMajor:
              type: string
            odbVersionMinor:
              type: string
            odbSource:
              type: string
            creationDateDate:
              type: string
              format: date-time
              description: Creation date (RFC 3339).
            saveDate:
              type: string
              format: date-time
              description: Last save date (RFC 3339).
            saveApp:
              type: string
            saveUser:
              type: string
            units:
              type: string
              description: Design units, e.g. `INCH`, `MM`.
              example: INCH
            maxUniqueId:
              type: integer
              format: int32
              description: Highest feature id assigned in the design.

        MatrixFile:
          type: object
          description: "`matrix/matrix` file — board stackup rows/columns."
          properties:
            steps:
              type: array
              items:
                $ref: "#/components/schemas/MatrixStepRecord"
            layers:
              type: array
              items:
                $ref: "#/components/schemas/MatrixLayerRecord"
        MatrixStepRecord:
          type: object
          properties:
            column:
              type: integer
              format: int32
            id:
              type: integer
              format: int32
            name:
              type: string
              example: pcb
        MatrixLayerRecord:
          type: object
          properties:
            row:
              type: integer
              format: int32
            context:
              type: string
              enum: [Board, Misc]
            type:
              type: string
              enum:
                [Signal, PowerGround, Dielectric, Mixed, SolderMask, SolderPaste,
                 SilkScreen, Drill, Rout, Document, Component, Mask, ConductivePaste]
            name:
              type: string
              example: top
            polarity:
              type: string
              enum: [Positive, Negative]
            dielectricType:
              type: string
              enum: [None, Prepreg, Core]
            dielectricName:
              type: string
            form:
              type: string
              enum: [Rigid, Flex]
            cuTop:
              type: integer
              format: int32
              description: Copper weight (top side), percent.
            cuBottom:
              type: integer
              format: int32
              description: Copper weight (bottom side), percent.
            ref:
              type: integer
              format: int32
            startName:
              type: string
            endName:
              type: string
            oldName:
              type: string
            addType:
              type: string
            color:
              $ref: "#/components/schemas/Color"
            id:
              type: integer
              format: int32

        AttrListFile:
          type: object
          description: Attribute list file (`attrlist`).
          properties:
            directory:
              type: string
            path:
              type: string
            units:
              type: string
            attributesByName:
              type: object
              additionalProperties:
                type: string
              description: Attribute name/value pairs.
              example:
                .-owned-by: ucamco

        StandardFontsFile:
          type: object
          description: "`fonts/standard` file — vector stroke font."
          properties:
            xSize:
              type: number
              format: double
            ySize:
              type: number
              format: double
            offset:
              type: number
              format: double
            mCharacterBlocks:
              type: array
              items:
                $ref: "#/components/schemas/CharacterBlock"
        CharacterBlock:
          type: object
          properties:
            character:
              type: string
              description: The character this block draws (e.g. `A`).
            mLineRecords:
              type: array
              items:
                $ref: "#/components/schemas/FontLineRecord"
        FontLineRecord:
          type: object
          properties:
            xStart:
              type: number
              format: double
            yStart:
              type: number
              format: double
            xEnd:
              type: number
              format: double
            yEnd:
              type: number
              format: double
            polarity:
              type: string
              enum: [Positive, Negative]
            shape:
              type: string
              enum: [Square, Round]
            width:
              type: number
              format: double

        NetlistFile:
          type: object
          description: A netlist file (`netlists/<netlist>`).
          properties:
            path:
              type: string
            name:
              type: string
            units:
              type: string
            optimized:
              type: boolean
            staggered:
              type: string
              enum: [Yes, No, Unknown]
            netRecordss:
              type: array
              description: "Net records (note: field name matches the source model)."
              items:
                $ref: "#/components/schemas/NetlistNetRecord"
            netRecordsByName:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/NetlistNetRecord"
            netPointRecords:
              type: array
              items:
                $ref: "#/components/schemas/NetPointRecord"
        NetlistNetRecord:
          type: object
          properties:
            serialNumber:
              type: integer
              format: int32
            netName:
              type: string
              example: GND
        NetPointRecord:
          type: object
          properties:
            netNumber:
              type: integer
              format: int32
            radius:
              type: number
              format: double
            x:
              type: number
              format: double
            y:
              type: number
              format: double
            side:
              type: string
              enum: [Top, Down, Both, Inner]
            width:
              type: number
              format: double
            height:
              type: number
              format: double
            epoint:
              type: string
            exp:
              type: string
            commentPoint:
              type: boolean
            staggeredX:
              type: number
              format: double
            staggeredY:
              type: number
              format: double
            staggeredRadius:
              type: number
              format: double
            viaPoint:
              type: number
              format: double
            fiducialPoint:
              type: number
              format: double
            testPoint:
              type: number
              format: double
            testExecutionSide:
              type: string

        EdaDataFile:
          type: object
          description: "`eda/data` file — electrical analysis data."
          properties:
            path:
              type: string
            units:
              type: string
            source:
              type: string
            layerNames:
              type: array
              items:
                type: string
            attributeNames:
              type: array
              items:
                type: string
            attributeTextValues:
              type: array
              items:
                type: string
            netRecords:
              type: array
              items:
                $ref: "#/components/schemas/EdaNetRecord"
            netRecordsByName:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/EdaNetRecord"
            packageRecords:
              type: array
              items:
                $ref: "#/components/schemas/EdaPackageRecord"
            packageRecordsByName:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/EdaPackageRecord"
            propertyRecords:
              type: array
              items:
                $ref: "#/components/schemas/PropertyRecord"
            featureGroupRecords:
              type: array
              items:
                $ref: "#/components/schemas/EdaFeatureGroupRecord"
        EdaNetRecord:
          type: object
          properties:
            name:
              type: string
            attributesIdString:
              type: string
            index:
              type: integer
              format: int32
            subnetRecords:
              type: array
              items:
                $ref: "#/components/schemas/EdaSubnetRecord"
            propertyRecords:
              type: array
              items:
                $ref: "#/components/schemas/PropertyRecord"
            attributeLookupTable:
              type: object
              additionalProperties:
                type: string
        EdaSubnetRecord:
          type: object
          properties:
            type:
              type: string
              enum: [VIA, TRACE, PLANE, TOEPRINT]
            featureIdRecords:
              type: array
              items:
                $ref: "#/components/schemas/EdaFeatureIdRecord"
            fillType:
              type: string
              enum: [SOLID, OUTLINE]
              description: Plane subnets only.
            cutoutType:
              type: string
              enum: [CIRCLE, RECTANGLE, OCTAGON, EXACT]
              description: Plane subnets only.
            fillSize:
              type: number
              format: double
              description: Plane subnets only.
            side:
              type: string
              enum: [BsNone, Top, Bottom]
              description: Toeprint subnets only.
            componentNumber:
              type: integer
              format: int32
              description: Toeprint subnets only.
            toeprintNumber:
              type: integer
              format: int32
              description: Toeprint subnets only.
            index:
              type: integer
              format: int32
        EdaFeatureIdRecord:
          type: object
          properties:
            type:
              type: string
              enum: [COPPER, LAMINATE, HOLE]
            layerNumber:
              type: integer
              format: int32
            featureNumber:
              type: integer
              format: int32
        EdaPackageRecord:
          type: object
          properties:
            name:
              type: string
            pitch:
              type: number
              format: double
            xMin:
              type: number
              format: double
            yMin:
              type: number
              format: double
            xMax:
              type: number
              format: double
            yMax:
              type: number
              format: double
            attributesIdString:
              type: string
            pinRecords:
              type: array
              items:
                $ref: "#/components/schemas/EdaPinRecord"
            pinRecordsByName:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/EdaPinRecord"
            propertyRecords:
              type: array
              items:
                $ref: "#/components/schemas/PropertyRecord"
            outlineRecords:
              type: array
              items:
                $ref: "#/components/schemas/EdaOutlineRecord"
            attributeLookupTable:
              type: object
              additionalProperties:
                type: string
        EdaPinRecord:
          type: object
          properties:
            name:
              type: string
            type:
              type: string
              enum: [ThroughHole, Blind, Surface]
            xCenter:
              type: number
              format: double
            yCenter:
              type: number
              format: double
            finishedHoleSize:
              type: number
              format: double
              description: Unused (always 0).
            electricalType:
              type: string
              enum: [Electrical, NonElectrical, Undefined]
            mountType:
              type: string
              enum:
                [Smt, RecommendedSmtPad, MT_ThroughHole, RecommendedThroughHole,
                 PressFit, NonBoard, Hole, MT_Undefined]
            id:
              type: integer
              format: int32
            index:
              type: integer
              format: int32
        EdaOutlineRecord:
          type: object
          properties:
            type:
              type: string
              enum: [Rectangle, Circle, Square, Contour]
            lowerLeftX:
              type: number
              format: double
            lowerLeftY:
              type: number
              format: double
            width:
              type: number
              format: double
            height:
              type: number
              format: double
            xCenter:
              type: number
              format: double
            yCenter:
              type: number
              format: double
            halfSide:
              type: number
              format: double
            radius:
              type: number
              format: double
            contourPolygons:
              type: array
              items:
                $ref: "#/components/schemas/ContourPolygon"
        EdaFeatureGroupRecord:
          type: object
          properties:
            type:
              type: string
            propertyRecords:
              type: array
              items:
                $ref: "#/components/schemas/PropertyRecord"
            featureIdRecords:
              type: array
              items:
                $ref: "#/components/schemas/EdaFeatureIdRecord"

        StepHdrFile:
          type: object
          description: "`stephdr` file — step header."
          properties:
            xDatum:
              type: number
              format: double
            yDatum:
              type: number
              format: double
            id:
              type: integer
              format: int32
            xOrigin:
              type: number
              format: double
            yOrigin:
              type: number
              format: double
            topActive:
              type: number
              format: double
            bottomActive:
              type: number
              format: double
            rightActive:
              type: number
              format: double
            leftActive:
              type: number
              format: double
            affectingBom:
              type: string
            affectingBomChanged:
              type: boolean
            online:
              type: string
            stepRepeatRecords:
              type: array
              items:
                $ref: "#/components/schemas/StepRepeatRecord"
            path:
              type: string
            onlineValues:
              type: object
              additionalProperties:
                type: string
        StepRepeatRecord:
          type: object
          properties:
            name:
              type: string
            x:
              type: number
              format: double
            y:
              type: number
              format: double
            dx:
              type: number
              format: double
            dy:
              type: number
              format: double
            nx:
              type: integer
              format: int32
            ny:
              type: integer
              format: int32
            angle:
              type: number
              format: double
              description: Rotation in degrees.
            flip:
              type: boolean
            mirror:
              type: boolean

        FeaturesFile:
          type: object
          description: A features file (`features` or step `profile`).
          properties:
            units:
              type: string
              example: INCH
            id:
              type: integer
              format: int32
            path:
              type: string
            directory:
              type: string
            numFeatures:
              type: integer
              format: int32
            featureRecords:
              type: array
              items:
                $ref: "#/components/schemas/FeatureRecord"
            symbolNamesByName:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/SymbolNameRecord"
            symbolNames:
              type: array
              items:
                $ref: "#/components/schemas/SymbolNameRecord"
        FeatureRecord:
          type: object
          description: |
            A single drawn feature. Which coordinate fields are meaningful depends on `type`:
            lines/arcs use start/end/center, pads use center + symbol reference, surfaces use
            contour polygons, texts use position + font + size.
          properties:
            type:
              type: string
              enum: [Arc, Pad, Surface, Barcode, Text, Line]
            xs:
              type: number
              format: double
              description: Start X.
            ys:
              type: number
              format: double
              description: Start Y.
            xe:
              type: number
              format: double
              description: End X (lines/arcs).
            ye:
              type: number
              format: double
              description: End Y (lines/arcs).
            x:
              type: number
              format: double
              description: Center X (pads/texts).
            y:
              type: number
              format: double
              description: Center Y (pads/texts).
            apt_def:
              type: integer
              format: int32
            apt_def_symbol_num:
              type: integer
              format: int32
            apt_def_resize_factor:
              type: number
              format: double
            xc:
              type: number
              format: double
              description: Arc center X.
            yc:
              type: number
              format: double
              description: Arc center Y.
            cw:
              type: boolean
              description: Arc direction (clockwise).
            font:
              type: string
              description: Text font name.
            xsize:
              type: number
              format: double
              description: Text X size.
            ysize:
              type: number
              format: double
              description: Text Y size.
            width_factor:
              type: number
              format: double
            text:
              type: string
              description: Text content (for `Text` features).
            version:
              type: integer
              format: int32
            sym_num:
              type: integer
              format: int32
              description: Symbol number (pads/lines).
            polarity:
              type: string
              enum: [Positive, Negative]
            dcode:
              type: integer
              format: int32
            atr:
              type: integer
              format: int32
              description: Attribute reference id.
            value:
              type: string
            id:
              type: integer
              format: int32
            orient_def:
              type: integer
              format: int32
            orient_def_rotation:
              type: number
              format: double
            contourPolygons:
              type: array
              description: Contour polygons (for `Surface` features).
              items:
                $ref: "#/components/schemas/ContourPolygon"
            attributeLookupTable:
              type: object
              additionalProperties:
                type: string
        ContourPolygon:
          type: object
          properties:
            type:
              type: string
              enum: [Island, Hole]
            xStart:
              type: number
              format: double
            yStart:
              type: number
              format: double
            polygonParts:
              type: array
              items:
                $ref: "#/components/schemas/PolygonPart"
        PolygonPart:
          type: object
          properties:
            type:
              type: string
              enum: [Segment, Arc]
            endX:
              type: number
              format: double
            endY:
              type: number
              format: double
            xCenter:
              type: number
              format: double
              description: Arc center X (for `Arc` parts).
            yCenter:
              type: number
              format: double
              description: Arc center Y (for `Arc` parts).
            isClockwise:
              type: boolean
              description: Arc direction (for `Arc` parts).
        SymbolNameRecord:
          type: object
          description: Symbol reference (symbols directory name + its unit type).
          properties:
            name:
              type: string
              example: r155
            unitType:
              type: string
              enum: [None, Metric, Imperial]

        ComponentsFile:
          type: object
          description: Layer components file (`layers/<layer>/components`).
          properties:
            units:
              type: string
            id:
              type: integer
              format: int32
            side:
              type: string
              enum: [BsNone, Top, Bottom]
            layerName:
              type: string
            path:
              type: string
            directory:
              type: string
            attributeNames:
              type: array
              items:
                type: string
            attributeTextValues:
              type: array
              items:
                type: string
            componentRecords:
              type: array
              items:
                $ref: "#/components/schemas/ComponentRecord"
            componentRecordsByName:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/ComponentRecord"
            propertyRecords:
              type: array
              items:
                $ref: "#/components/schemas/PropertyRecord"
            propertyRecordsByName:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/PropertyRecord"
            bomDescriptionRecordsByCpn:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/BomDescriptionRecord"
        ComponentRecord:
          type: object
          properties:
            pkgRef:
              type: integer
              format: int32
            locationX:
              type: number
              format: double
            locationY:
              type: number
              format: double
            rotation:
              type: number
              format: double
              description: Placement rotation in degrees.
            mirror:
              type: boolean
            compName:
              type: string
              description: Component reference designator.
              example: U1
            partName:
              type: string
            attributes:
              type: string
            id:
              type: integer
              format: int32
            index:
              type: integer
              format: int32
            propertyRecords:
              type: array
              items:
                $ref: "#/components/schemas/PropertyRecord"
            toeprintRecords:
              type: array
              items:
                $ref: "#/components/schemas/ToeprintRecord"
            attributeLookupTable:
              type: object
              additionalProperties:
                type: string
        ToeprintRecord:
          type: object
          description: A component pin's land pattern on this layer.
          properties:
            pinNumber:
              type: integer
              format: int32
            locationX:
              type: number
              format: double
            locationY:
              type: number
              format: double
            rotation:
              type: number
              format: double
            mirror:
              type: boolean
            netNumber:
              type: integer
              format: int32
            subnetNumber:
              type: integer
              format: int32
            name:
              type: string
        BomDescriptionRecord:
          type: object
          properties:
            cpn:
              type: string
              description: Company part number.
            pkg:
              type: string
              description: Package name.
            ipn:
              type: string
              description: Internal part number.
            descriptions:
              type: array
              items:
                type: string
            vpl_vnd:
              type: string
            vpl_mpn:
              type: string
            vnd:
              type: string
              description: Vendor name.
            mpn:
              type: string
              description: Manufacturer part number.

        ToolsFile:
          type: object
          description: Layer tools file (`layers/<layer>/tools`) — drill tool definitions.
          properties:
            directory:
              type: string
            path:
              type: string
            units:
              type: string
            thickness:
              type: number
              format: double
            userParams:
              type: string
            tools:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/ToolsRecord"
        ToolsRecord:
          type: object
          properties:
            toolNum:
              type: integer
              format: int32
            type:
              type: string
              enum: [Plated, NonPlated, Via]
            type2:
              type: string
              enum: [Standard, PressFit, Photo, Laser]
            minTol:
              type: number
              format: double
            maxTol:
              type: number
              format: double
            drillBit:
              type: string
            finishSize:
              type: number
              format: double
            drillSize:
              type: number
              format: double

        # ------------------------------------------------------------- diagnostics
        SymbolUnitsDiagnostics:
          type: object
          description: Symbol unit-type analysis for a step (server-built JSON, snake_case keys).
          required: [design, step, layers]
          properties:
            design:
              type: string
            step:
              type: string
            layers:
              type: array
              items:
                $ref: "#/components/schemas/LayerSymbolUnits"
        LayerSymbolUnits:
          type: object
          properties:
            layer:
              type: string
            features_units_raw:
              type: string
              description: Raw units string from the layer features file.
              example: INCH
            symbols_total:
              type: integer
              description: Total number of symbols referenced by the layer.
            symbol_unit_counts:
              type: object
              properties:
                metric:
                  type: integer
                imperial:
                  type: integer
                none:
                  type: integer
            has_mixed_symbol_unit_types:
              type: boolean
              description: True when both metric and imperial symbols are present.
            has_mismatch_vs_features_units:
              type: boolean
              description: True when a symbol unit type contradicts the features file units.

        # ------------------------------------------------------------ product model
        Design:
          type: object
          description: Aggregated product model for a design.
          properties:
            productModel:
              type: string
              description: Source product model name.
            name:
              type: string
              description: Design name.
            fileModel:
              $ref: "#/components/schemas/FileArchive"
            nets:
              type: array
              items:
                $ref: "#/components/schemas/Net"
            netsByName:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/Net"
            packages:
              type: array
              items:
                $ref: "#/components/schemas/Package"
            packagesByName:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/Package"
            components:
              type: array
              items:
                $ref: "#/components/schemas/Component"
            componentsByName:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/Component"
            parts:
              type: array
              items:
                $ref: "#/components/schemas/Part"
            partsByName:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/Part"
        Component:
          type: object
          description: Placed component in the product model.
          properties:
            refDes:
              type: string
              description: Reference designator.
              example: U1
            partName:
              type: string
            package:
              $ref: "#/components/schemas/Package"
            index:
              type: integer
              format: int32
            side:
              type: string
              enum: [BsNone, Top, Bottom]
            part:
              $ref: "#/components/schemas/Part"
        Net:
          type: object
          description: Electrical net with its pin connections.
          properties:
            name:
              type: string
              example: GND
            pinConnections:
              type: array
              items:
                $ref: "#/components/schemas/PinConnection"
            index:
              type: integer
              format: int32
        PinConnection:
          type: object
          properties:
            name:
              type: string
            component:
              $ref: "#/components/schemas/Component"
            pin:
              $ref: "#/components/schemas/Pin"
        Pin:
          type: object
          properties:
            name:
              type: string
            index:
              type: integer
              format: int32
        Package:
          type: object
          description: Component package (land pattern) with its pins.
          properties:
            name:
              type: string
            pins:
              type: array
              items:
                $ref: "#/components/schemas/Pin"
            pinsByName:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/Pin"
            index:
              type: integer
              format: int32
        Part:
          type: object
          properties:
            name:
              type: string
              description: Part number.
              example: RES-10K-0402
kind: ConfigMap
metadata:
  name: odbdesign-server-swagger-spec
