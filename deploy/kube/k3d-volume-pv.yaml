apiVersion: v1
kind: PersistentVolume
metadata:
  name: k3d-volume
  #name: task-pv-volume
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteOnce
  hostPath:
    # created automatically by the kubelet on first mount (k3s node);
    # the old k3d value was /mnt/d/k3dvolume (Windows host path)
    path: /srv/odbdesign-volume
    type: DirectoryOrCreate