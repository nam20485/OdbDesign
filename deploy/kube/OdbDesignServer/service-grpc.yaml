##################################################################################################
# OdbDesignServer gRPC service (ClusterIP — backend of the Traefik IngressRouteTCP)
#
# M3.1 (gRPC TLS): Traefik terminates TLS on the `grpc` entrypoint
# (deploy/kube/odbdesign-grpc-ingressroute-tcp.yaml) and forwards h2c to this
# service, so it no longer needs its own LoadBalancer. Applied by
# scripts/deploy.ps1 only under -EnableTls; the no-flag default applies
# service-grpc-loadbalancer.yaml instead (direct ServiceLB exposure, node :50051).
##################################################################################################
apiVersion: v1
kind: Service
metadata:
  name: odbdesign-server-grpc-service
  labels:
    app: odbdesign-server
    service: odbdesign-server-grpc
spec:
  type: ClusterIP
  ports:
    - name: ods-grpc-port
      port: 50051
      targetPort: ods-grpc-port
      protocol: TCP
  selector:
    app: odbdesign-server

