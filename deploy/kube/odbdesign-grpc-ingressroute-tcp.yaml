# M3.1 (server-issues-implementation-plan.md; https-tls-options.md §8 option 1):
# gRPC TLS termination at the edge via Traefik TCP routing, sharing the
# odbdesign-server-tls secret with the REST ingress (single cert source,
# Option C).
#
# apiVersion: traefik.io/v1alpha1 is the Traefik v3 CRD group (shipped with
# current k3s). traefik.containo.us/v1alpha1 is the Traefik v2 fallback if
# this manifest is ever used against an older cluster — same schema, swap the
# group only.
#
# Field notes (verified against Traefik v3 docs):
# - IngressRouteTCP routes raw TCP; after `tls.secretName` termination the
#   decrypted stream is piped to the backend verbatim, so the backend's h2c
#   (cleartext HTTP/2, i.e. the gRPC server) needs no h2c:// scheme or
#   serversTransport — those apply to HTTP-routes/re-encryption only.
# - match HostSNI(`*`) is the catch-all rule for TLS-terminating TCP routers
#   (TLS router rules must contain a HostSNI matcher; `*` matches every
#   client — they are verified against cert SANs, not SNI).
#
# Requires: cert-manager Certificate odbdesign-server-tls (certificate-odbs-server.yaml),
# the traefik `grpc` entrypoint (traefik-helmchartconfig-grpc-entrypoint.yaml),
# and the gRPC service as ClusterIP (deploy/kube/OdbDesignServer/service-grpc.yaml).
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: odbdesign-server-grpc
  namespace: default
spec:
  entryPoints:
    - grpc
  routes:
    - match: HostSNI(`*`)
      services:
        - name: odbdesign-server-grpc-service
          port: 50051
  tls:
    secretName: odbdesign-server-tls
