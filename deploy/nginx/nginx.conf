# nginx reverse proxy for OdbDesignServer.
#
# Routes all external traffic through a single TLS endpoint on :443.
# Sibling containers (server, swagger-ui) are reachable only via this
# proxy from outside the compose network.
#
# Required cert files (mounted from ./ssl on the host):
#   - cert.pem        leaf certificate (and chain if not in fullchain.pem)
#   - cert.key        private key matching cert.pem
# Optional:
#   - dhparam.pem     DH parameters for DHE ciphers (uncomment ssl_dhparam if present)

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  75s;
    keepalive_requests 1000;

    # gzip response bodies (text only)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # File uploads: server's gRPC max is 150 MB; allow 200 MB on the wire
    # to leave headroom for envelope + headers.
    client_max_body_size 200m;
    client_body_buffer_size 1m;
    client_body_timeout 300s;

    # Upstream definitions
    upstream odbdesign_server {
        server server:8888;
        keepalive 32;
    }
    upstream odbdesign_grpc {
        # grpc_pass requires HTTP/2 to the upstream.
        server server:50051;
        keepalive 32;
    }
    upstream swagger_ui {
        server swagger-ui:8080;
        keepalive 16;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS — single public listener
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/cert.key;
        # ssl_dhparam          /etc/nginx/ssl/dhparam.pem;   # uncomment if you have one

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS — only safe if you're sure the cert chain is valid and clients
        # can roll back. 6 months is a common starting point.
        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ---- gRPC services (HTTP/2, gRPC framing) ----
        # Path-based routing for the two gRPC service prefixes used by
        # OdbDesignServer (Odb.Grpc.OdbDesignService and Odb.Lib.Protobuf.OdbDesignApi).
        # grpc_pass handles application/grpc framing automatically.
        location /Odb.Grpc.OdbDesignService/ {
            grpc_pass grpc://odbdesign_grpc;
            grpc_connect_timeout 10s;
            grpc_read_timeout    300s;
            grpc_send_timeout    300s;

            # Forward client info
            grpc_set_header Host                $host;
            grpc_set_header X-Real-IP           $remote_addr;
            grpc_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto   $scheme;
        }
        location /Odb.Lib.Protobuf.OdbDesignApi/ {
            grpc_pass grpc://odbdesign_grpc;
            grpc_connect_timeout 10s;
            grpc_read_timeout    300s;
            grpc_send_timeout    300s;

            grpc_set_header Host                $host;
            grpc_set_header X-Real-IP           $remote_addr;
            grpc_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto   $scheme;
        }

        # ---- REST API + swagger-ui (catch-all) ----
        # swagger-ui static assets + UI are served at / by the swagger-ui container.
        # More-specific REST locations below override this for /designs/, etc.
        location / {
            proxy_pass http://swagger_ui;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        # Explicit REST routes — list mirrors swagger/odbdesign-server-0.9-swagger.yaml
        # Crow health endpoints + REST API paths all hit server:8888.
        location ~ ^/(healthz|ready)(/|$) {
            proxy_pass http://odbdesign_server;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        location /designs/ {
            proxy_pass http://odbdesign_server;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    600s;   # large designs can take a while
            proxy_read_timeout    600s;
        }
        location /filemodels/ {
            proxy_pass http://odbdesign_server;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        location /files/ {
            proxy_pass http://odbdesign_server;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # uploads: longer timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
        }
    }
}
